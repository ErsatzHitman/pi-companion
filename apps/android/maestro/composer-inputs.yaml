appId: ${APP_ID}
name: "composer inputs — keyboard entry live; voice recording and attachment picking now real (permission-gated); share intent blocked, named"
tags:
  - composer
---
# T37E3 (plan.md §14.4 "composing with keyboard, voice, attachment, and
# share intent"). This wave has no emulator, no device, and no Maestro
# binary (same as every T37E* flow so far — see ../README.md's own "What
# T37D proved, and what it did not") — this flow has never been run.
# `../e2e/flows/composer-inputs.contract.test.ts` is this flow's real
# proof: every testId/string named below is `readCode()`-matched (full
# JSX/statement expressions, comment-stripped, anchored to the one
# top-level component that owns it) against real source, not a bare
# identifier — see that file's own doc comment.
#
# ---------------------------------------------------------------------
# TWO OF FOUR INPUT MODES STILL CANNOT BE EXERCISED HERE — T276 changed
# WHY for voice, so the reasons below are restated rather than repeated.
# T70 wired a real `VoiceCaptureController` into `Composer.tsx`'s mic
# button (CORRECTED at the P9-O merge gate: this said "over the same
# outbox/sessionId/onSubmit a text send uses" — T277 removed the outbox
# from voice entirely; a finished transcript is now a composer DRAFT),
# and
# T69 mounted the share receiver at `apps/android/src/app/share.tsx`
# over `AppCore.shareIntentPort`. **T276 (plan.md §9.2) then made the
# capture itself real**: `Composer.tsx` now defaults `voiceCapture` to
# `createExpoAudioVoiceCapturePort()` (`../src/features/voice/expo-
# audio-voice-capture-port.ts`), not the "unavailable" one — pressing
# the mic on a real device now resolves microphone permission for real
# (T83's one-resolution-per-press invariant unchanged) and, once
# granted, actually records. This flow does NOT exercise that outcome:
# a first-run permission check is `"undetermined"`, so `requestStart()`
# prompts the OS's own native permission dialog, and this flow has no
# `Maestro`-side handling for that dialog (no emulator/device/Maestro
# binary exists in this wave either — same standing limitation the
# paragraph above already names). So the MIC BUTTON section below only
# proves the tap itself is live and real; it asserts nothing about what
# follows, and says so at the point it stops. Nothing yet navigates to
# `/share` automatically (filed against T32S15 by T69), so no share can
# be reached from here. **T290 GAP CLOSED**: attachment *picking* used
# to be similarly stubbed (`attachment-source-port.ts`'s own doc comment
# recorded that no `expo-image-picker`/`expo-document-picker` dependency
# was installed, so `createUnavailableAttachmentSourcePort` was its only
# production implementation). The owner installed both packages and
# T290 wired a real, `expo-document-picker`-backed
# `createExpoAttachmentSourcePort()` at the session mount — pressing
# attach now opens the real native document/photo picker, the same
# "live tap, unobservable outcome" shape as the MIC BUTTON section
# above: Maestro cannot read the native picker UI, so the ATTACH BUTTON
# section below stops at the tap exactly like the mic one does, rather
# than asserting the now-untrue "unavailable" banner.
#
# CORRECTED (T380): this said the reason was that the flow "has no
# emulator/device/Maestro binary to drive or read the native picker UI".
# That cause stopped being true — this flow runs on a booted emulator in
# every dispatch, green in 34558058662 — while the conclusion it
# supported is still right, for a better reason: the document/photo
# picker is a SYSTEM surface outside this app's process, and Maestro's
# view hierarchy stops at the app under test. A device does not help;
# the picker is unobservable to this driver on any device.
#
# So this flow proves what is actually true today, split into two
# halves:
#
#   1. KEYBOARD ENTRY — fully live, exercised below end-to-end,
#      including composing, sending, and seeing the message reconcile to
#      a real, named terminal status. This still needs no daemon and no
#      pairing, but P5-W19 changed *which* status that is, so read on.
#      P5-W18 correction: that route's `turnService` prop is NO LONGER a
#      no-op. T63 built a real `TurnService` and T32S12 mounted it via
#      `useAppCore().createTurnService(agentId)`, so steer/follow-up/abort
#      now reach a live `DaemonClient` when one is connected.
#      P5-W19 correction: `onSubmit` is NO LONGER a no-op either. T32S13
#      wired `session/[agentId]/index.tsx`'s `handleSubmit` to
#      `AppCore.startTurn` -> T63's `startDaemonTurn`, so a send now
#      genuinely tries to reach a daemon. On an unpaired run there is
#      none, `startDaemonTurn` settles `{ status: "failed" }`
#      ("Not connected to a daemon"), `handleSubmit` re-throws, and
#      `Composer`'s own `markEntryFailed` path renders the entry as
#      "Failed" with its text recoverable via Retry. That is what this
#      flow asserts below — the honest unpaired outcome, never a
#      delivered turn. Asserting "Sent" here would now be asserting a
#      state this app cannot reach without a daemon. A paired run that
#      reaches "Sent" is T59's (real device) to add.
#      `handleAttachPress` remains a local no-op. `handleMicPress` is
#      now real END TO END, as of T282: CORRECTED at the P9-O merge gate,
#      this section used to say the mic was real as far as CAPTURE goes
#      since T276 but NOT end to end, because the only `<Composer>` mount
#      in the app (`../src/app/h/[serverId]/session/[agentId]/index.tsx`)
#      passed no `transcribeClient`, so a recording made on a real device
#      always resolved `"transcription-unavailable"` and the clip was
#      discarded — a user granted a real OS permission and got nothing
#      back. T282 closed that: the session route now resolves
#      `transcribeClient` off the same live `AppCore.connection`-derived
#      `DaemonClient` `queueModeClient`/`turnStatusClient` already use
#      (`../src/app-shell/session-route-daemon-clients.ts`'s
#      `resolveTranscribeClient`), so a recording made against a
#      connected daemon now genuinely transcribes through Groq and lands
#      as editable composer draft text. This flow still cannot exercise
#      that outcome itself (no daemon connection in this flow's
#      deep-link-only setup — CORRECTED (T380): this parenthetical said
#      "no emulator/device/Maestro binary", a cause that stopped being
#      true once this flow started running on a booted emulator every
#      dispatch; the clause that actually blocks the outcome is the one
#      immediately following, which was always the real one), and there
#      is no daemon connection in this flow's
#      own deep-link-only setup either way, so a recording made HERE
#      would still resolve the honest "transcription-unavailable" state
#      — not because the prop is unwired any more, but because this flow
#      talks to no daemon at all (see "Reaching the composer without
#      pairing" below). The mic and attach buttons are both live (real,
#      tappable, real testIds), and — since T290 — share the SAME
#      outcome shape mic already had: neither resolves "unavailable" any
#      more. Mic no longer resolves "unavailable" at all (that state is
#      now reserved for a caller that explicitly disables voice, which
#      nothing does here); attach no longer does either, now that T290
#      wired a real `createExpoAttachmentSourcePort()` (backed by
#      `expo-document-picker`, which needs no Android permission at all
#      — see that module's own header) — a real device now opens the
#      native document/photo picker directly, no permission prompt in
#      the way, which this flow taps into but does not attempt to drive
#      further (see above), the identical limitation the mic dialog
#      already has.
#   2. SHARE INTENT — cannot be exercised at all, on a device or
#      otherwise, and this flow does not try to fake one. `Composer`
#      has no share-intent affordance of its own to begin with (a share
#      target reaches the app through Android's own share sheet, not
#      through anything inside the composer); the receiver that would
#      turn a real `ACTION_SEND` `Intent` into a queued draft
#      (`features/share/share-intent-receiver.ts`) is real and unit-
#      tested against a scripted fake port, IS now mounted: T69 (P5-W21)
#      added `apps/android/src/app/share.tsx`, which wraps
#      `AppCore.shareIntentPort` in `share-chooser-runtime.ts` and
#      renders `ShareChooserScreen.tsx`. (`features/share/index.ts` now
#      says "Mounted as of T69"; its old "Nothing imports this yet" note
#      this file used to cite no longer exists.) Two gaps remain, neither
#      this task's `Owns` grant (`../e2e/`, this file):
#        a. Nothing NAVIGATES to `/share` automatically when a live
#           share arrives while another screen is on top — T69 filed
#           that against `T32S15` by name in the route's own doc
#           comment. `/share` is reachable today only by direct
#           navigation, or by its own cold-start
#           `getInitialShareIntent()` read once that route mounts.
#        b. The native half exists in source (T36F's Expo config plugin
#           adding the `SEND` intent-filter, plus the Expo Module
#           reading `Intent.EXTRA_TEXT`/`EXTRA_STREAM`), but
#           `createNativeShareIntentPort()` falls back to a real,
#           honest "unavailable" port whenever that native module is not
#           linked — which it is not in any build this harness can
#           produce, since linking needs `expo prebuild` + Gradle,
#           categorically out of reach here (this wave's hard rules).
#           So no real `ACTION_SEND` intent can be delivered to the app
#           under test, which is why this flow asserts nothing about it.
#      What IS true and provable without either: `buildShareIntentFilters()`
#      (`share-intent-config.ts`) is real and wired into `app.config.ts`
#      today, so the OS-level "Share to Pi Companion" target registration
#      itself is not blocked — only the in-app receiving half is. This
#      flow does not assert anything about that OS-level registration
#      either, since confirming an app actually appears in Android's
#      share sheet needs a real installed build, which this wave cannot
#      produce (`../README.md`'s "Prerequisites").
#
# See ../e2e/flows/composer-inputs-contract.ts for the single restated
# source of every testId/string below.
#
# ## Reaching the composer without pairing
#
# CORRECTED (T336): the paragraph below describes a gap that is closed --
# the connect now saves the profile and navigates (T32A8/T331), and the
# sessions route pushes the session screen when a row is tapped (T336),
# so ../cold-start-restore.yaml walks the button-driven path end to end.
# This flow keeps its `openLink` entry regardless: it needs no daemon at
# all, and the deep link is the cheapest way to the composer.
# `cold-start-restore.yaml` (T37E2) already disclosed a real production
# gap: a successful `ConnectForm` submission never calls `saveHostProfile`
# and never navigates away from `/connect`, so there is today no in-app,
# button-driven path from a fresh install to any `/h/:serverId/...`
# route. That gap is still open (re-verified for this task: `grep -rn
# saveHostProfile apps/android/src` still finds only its own definition,
# its test, and its re-export). Rather than block this flow on it too,
# this flow opens the session route directly with Maestro's `openLink`,
# using the app's own already-registered `picompanion://` deep-link
# scheme (`app.config.ts`) and the `"session"` match
# `deep-link-routing.ts` already defines for `h/<serverId>/session/
# <agentId>`. This is a real, already-shipped mechanism — Expo Router
# resolves that URL straight to `session/[agentId]/index.tsx`'s file,
# independent of any in-app button or of `ConnectForm` ever having run —
# not a workaround invented for this flow. `serverId`/`agentId` are
# free-form path segments this route never validates against a real
# paired host (it only ever uses them as display labels — see
# `SessionRoute`'s own doc comment), so any non-empty strings work here.
#
# `clearState`/`clearKeychain` still start this flow from the same
# fresh-install state every other flow in this directory does
# (../README.md's "Flow independence") — this flow depends on no other
# flow, and the deep link below reaches the composer before onboarding
# would otherwise gate it (`OnboardingGate` wraps only `/connect`'s
# `ConnectionShell`, never anything under `h/[serverId]/`, confirmed by
# reading `_layout.tsx`: no onboarding gate wraps the whole router tree).
# This flow talks to no daemon at all (no `${DAEMON_HOST}`/`${DAEMON_PORT}`
# reference below), so it needs no cleanup beyond the app's own fresh
# `clearState` — nothing it does persists past the run, and nothing it
# reads depends on state a prior run of itself or of any other flow left
# behind. That also makes it trivially safe to shard alongside the other
# `../maestro/*.yaml` flows: distinct package, distinct in-memory
# per-launch state, no shared daemon, no shared file.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "picompanion://h/e2e-host/session/e2e-session"

# --- Composer renders under its default root testId ("composer" —
# --- session/[agentId]/index.tsx passes no `testId` prop, so
# --- `Composer.tsx`'s own `testId ?? "composer"` fallback applies).
- assertVisible:
    id: "composer"

# --- KEYBOARD ENTRY: type a message and send it. No daemon, no
# --- pairing. Since T32S13 (P5-W19) `onSubmit` is a real call into
# --- `AppCore.startTurn`, so with nothing connected the optimistic
# --- "Sending…" entry reconciles to "Failed"
# --- (`composer-model.ts`'s `entryStatusLabel("failed")`, mirrored by
# --- ../e2e/flows/composer-inputs-contract.ts's `entryFailedLabel`) —
# --- the entry text stays visible and recoverable via Retry. This flow
# --- still waits on nothing external: the refusal is local and
# --- immediate.
- tapOn:
    id: "composer-input"
- inputText: "Testing composer keyboard entry"
- tapOn:
    id: "composer-send"
- assertVisible:
    id: "composer-entries"
- assertVisible:
    text: "Testing composer keyboard entry"
- assertVisible:
    text: "Failed"

# --- MIC BUTTON (T276): live and tappable, and — since T276 — backed by
# --- a real `VoiceCapturePort` (`createExpoAudioVoiceCapturePort()`,
# --- Composer.tsx's own default). A fresh install has never asked for
# --- microphone permission, so `requestStart()`'s `resolvePermission`
# --- reads "undetermined" and prompts the OS's own native permission
# --- dialog (T83's one-resolution-per-press invariant: exactly once,
# --- not twice). This flow stops at the tap: it asserts nothing about
# --- that dialog or what follows it, because there is no
# --- Maestro/device/emulator in this wave to drive or observe it (see
# --- this file's header). A future device run (T59) must decide how to
# --- handle the OS dialog (Maestro can tap system permission prompts by
# --- id/text once one is actually on screen to inspect) and can then
# --- assert the real outcome — recording, waveform-only per T276's own
# --- product change (`voice-capture-indicator.tsx`; no more "unavailable"
# --- text is possible here, since that state is reserved for a caller
# --- that explicitly disables voice, which nothing does at this mount).
- tapOn:
    id: "composer-mic"

# --- ATTACH BUTTON (T290): live and tappable, and — since T290 — backed
# --- by a real `AttachmentSourcePort` (`createExpoAttachmentSourcePort()`,
# --- Composer.tsx's own default at the session mount), not the
# --- "unavailable" fallback this section used to assert. That real port
# --- is backed by `expo-document-picker`, which needs no Android
# --- permission at all (Storage Access Framework — see that module's
# --- own header), so `composer-attachment-permission-notice` never
# --- renders any more (`PermissionRecoveryNotice` renders nothing for
# --- "granted" — see its own doc comment) and pressing attach goes
# --- straight to the real native document/photo picker. This flow stops
# --- at the tap, the identical limitation the MIC BUTTON section above
# --- already has: the native picker is a system surface outside this
# --- app's process, so Maestro's view hierarchy cannot observe it and
# --- nothing below asserts what follows. CORRECTED (T380): this read
# --- "no emulator/device/Maestro binary in this wave to drive or
# --- observe the native picker UI" — see this file's header for why
# --- that cause is gone and this one was always the real one.
- tapOn:
    id: "composer-attach"
# --- SHARE INTENT: deliberately not exercised here — see this file's
# --- header comment section 2 for exactly why (no in-app receiver
# --- mounted, no native module to deliver a real ACTION_SEND intent
# --- through even if one were). Nothing below this line pretends
# --- otherwise.
