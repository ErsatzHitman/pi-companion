appId: ${APP_ID}
name: "recovered-turn banner — the real banner text, and Resend/Discard reaching a real outbox"
tags:
  - transcript
---
# T106 (plan.md §14.4 family; docs/issues-from-plan.md "Prove the
# recovered-turn banner above the source-text layer"). Same standing
# limitation as every flow in this directory (`../README.md`'s "What
# T37D proved, and what it did not"): this wave has no emulator, no
# device, and no Maestro binary, so this flow has never been run.
# `../e2e/flows/recovered-turn-banner.contract.test.ts` is the real,
# gate-able proof — it parses this file's own steps
# (`../e2e/flows/maestro-yaml.ts`'s `parseMaestroSteps`) and checks every
# id/text below against real, unmocked source, the same discipline
# `composer-inputs.contract.test.ts` established (T72) after
# `composer-inputs.yaml` drifted into asserting a status label the wired
# app could no longer reach and nothing caught it because nothing ever
# read the yaml back.
#
# CORRECTED (T380): the sentence above says this flow shares a standing
# limitation with "every flow in this directory", and cites
# `../README.md`'s "What T37D proved, and what it did not". That section
# was corrected at T371 and now records the opposite, so the citation
# points at its own refutation.
#
# What is still true is narrower, and the difference matters to anyone
# deciding whether to run this. It is not that this flow CANNOT run for
# want of a device: the emulator boots on every dispatch, `smoke.yaml`
# runs in `packaged-app-smoke`, and the ten sharded flows were green end
# to end in dispatch 34558058662. It is that this flow is not assigned to
# a shard, so nothing runs it. The infrastructure exists; this flow sits
# outside the set that uses it, and "has never been run" is the
# consequence of that exclusion rather than evidence for it. See
# `../e2e/harness/shard-plan.ts`'s `NON_EXIT_GATE_FLOW_NAMES` for this
# flow's own stated reason.
#
# CORRECTED (T381): still unassigned, and deliberately so — not an
# oversight left over from the correction above. This flow's `openLink:`
# step targets a `picompanion://dev/…` route whose wrapper redirects to
# `/` outside `__DEV__`, and CI only builds `assembleRelease`, so no
# dispatch can mount this flow's screen. T381's non-gating observation
# job derives its set from the tree and leaves dev-linked flows out for
# exactly this reason (`shard-plan.ts`'s `listNonExitGateFlowNames`).
# Observing this flow needs a real mount point for its component (the
# disclosed gap below) or a Metro-backed debug-APK job; until one exists,
# "has never been run" is the accurate state, and this paragraph is why.
# ---------------------------------------------------------------------
# WHY THIS FLOW OPENS A DEV-ONLY LAB ROUTE, NOT THE REAL SESSION SCREEN.
#
# `RecoveredTurnBanner` (`../src/features/transcript/recovered-turn-
# banner.tsx`, T95/T106) imports `react-native`, so — like every other
# view in this tree — a plain `vitest` run can only prove its JSX by
# anchored source text, never by rendering it (that file's own doc
# comment: the repo-wide limitation, proven 27 times before this one).
# Closing that gap for real needs *some* screen, reachable by Maestro,
# that mounts the REAL component against a REAL recovered turn. The
# session route that actually owns this banner in production
# (`../src/app/h/[serverId]/session/[agentId]/index.tsx`) cannot supply
# one on this build, for two independent, disclosed reasons — neither
# closable from this flow or from `recovered-turn-banner.tsx`/
# `recovered-turn-model.ts` alone:
#
#   1. CORRECTED (T390): this reason no longer exists. `expo-sqlite` is
#      installed and `TurnOutboxOwner` opens a real database file, so
#      `getRecoveredTurns()` returns real rows on a device with the
#      native `ExpoSQLite` module present.
#
#   2. CORRECTED (T121): `Composer.tsx` and this banner now share the one
#      `AppCore.turnOutbox`-owned `OutboxController` —
#      `../src/app/h/[serverId]/session/[agentId]/index.tsx` passes the
#      identical `core.turnOutbox.getOutbox() ?? undefined` expression to
#      both — so the "separate instance, separate storage" split this
#      reason described is gone.
#
# What still justifies this lab: producing a real recovered row on a
# device needs a real turn left mid-flight by a process kill, which a
# Maestro flow cannot reliably stage. Lab seeding the fixture directly
# keeps the banner's real rendering and its Resend/Discard actions
# provable without that staged kill.
#
# So this task adds one small, `__DEV__`-gated surface —
# `../src/dev/recovered-turn-lab.tsx` (content) plus
# `../src/app/dev/recovered-turn-lab.tsx` (route wrapper, dead-code-
# eliminated out of a release build exactly like `component-lab.tsx`/
# `recipe-lab.tsx` already are, plan.md §10.3/§10.4's own dev-lab
# convention) — that mounts the REAL `RecoveredTurnBanner` against a
# hand-built `AwaitingConfirmationTurn` fixture and a plain
# `RecoveredTurnOutbox`-shaped object, closing gap (1)/(2)'s reachability
# problem for the VIEW layer specifically, without pretending the full
# crash-recovery pipeline is reachable (it is not — see the lab's own
# doc comment, and this task's report, for the exact chain above kept
# honest rather than papered over). This is a disclosed, deliberate
# expansion beyond this task's literal four-file `Owns` grant, made
# because the acceptance criterion ("a maestro flow asserts the
# banner's real text with a recovered turn present") has no other real
# surface to point at on this build.
#
# `clearState`/`clearKeychain` starts fresh, same as every flow here;
# this flow pairs no host and talks to no daemon at all (same shape as
# `offline-cache-outbox.yaml`), so it needs no daemon host/port and no
# cleanup beyond the app's own fresh `clearState`.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "picompanion://dev/recovered-turn-lab"

# --- The lab's own ScrollView root (recovered-turn-lab.tsx's `testID`).
- assertVisible:
    id: "recovered-turn-lab"
- assertVisible:
    id: "recovered-turn-lab-status"
- assertVisible:
    text: "Last action: none"

# ---------------------------------------------------------------------
# THE BANNER'S REAL RENDERED TEXT — describeRecoveredTurn()'s exact
# sentence, for BOTH fixture turns (`recovered-turn-lab.tsx`'s
# `FIXTURE_TURNS`: "lab-turn-1", "lab-turn-2"). Each Banner's testId is
# `recovered-turn-banner-${turn.id}` (`recovered-turn-banner.tsx`).
- assertVisible:
    id: "recovered-turn-banner-lab-turn-1"
- assertVisible:
    id: "recovered-turn-banner-lab-turn-2"
- assertVisible:
    text: "A message from before the app closed could not be confirmed as sent. It has not been resent automatically."

# ---------------------------------------------------------------------
# RESEND (confirmRecoveredTurn) — tapping it must reach the lab's own
# outbox object (never a fake pretending to be one; the counting-fake/
# real-OutboxController split is `recovered-turn-model.test.ts`'s job,
# not this flow's) and be visibly observed on screen, not just
# registered: "registration is not receipt" — the status line updates
# AND the acted-on turn's banner/actions disappear, never just one of
# the two.
- tapOn:
    id: "recovered-turn-banner-lab-turn-1-confirm"
- assertVisible:
    text: "Last action: confirmed lab-turn-1"
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-1"
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-1-actions"
# turn-2's banner is untouched by turn-1's action.
- assertVisible:
    id: "recovered-turn-banner-lab-turn-2"

# ---------------------------------------------------------------------
# DISCARD (discardRecoveredTurn) — the other half of the pair; both are
# mounted and proven here, never only one ("half a mount" is not a
# proof of the pair).
- tapOn:
    id: "recovered-turn-banner-lab-turn-2-discard"
- assertVisible:
    text: "Last action: discarded lab-turn-2"
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-2"
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-2-actions"

# Both fixture turns are now gone — the whole banner area is empty.
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-1"
- assertNotVisible:
    id: "recovered-turn-banner-lab-turn-2"
