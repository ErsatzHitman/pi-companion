name: Android Maestro E2E

# T37F (plan.md §14.4, §15.4; docs/issues-from-plan.md T37F) — the Phase 5
# exit gate: runs all ten §14.4 Maestro flows (apps/android/maestro/*.yaml,
# written by T37E1-T37E10) together, sharded, against a real emulator.
# This workflow owns shard scheduling and CI wiring only -- it writes no
# flow file and adds no second way to run one; every shard job below
# calls the exact same single-flow command T37D already built and
# documented (apps/android/maestro/README.md's "The one documented
# command"), once per flow the shard names in apps/android/maestro/
# shards.json (apps/android/e2e/harness/shard-plan.ts reads and validates
# that file; shard-plan.test.ts and flow-independence.test.ts prove the
# shard assignment and flow-order-independence claims below without a
# device).
#
# NOT PROVEN BY THIS FILE, and disclosed rather than hidden: this
# workflow has never executed end-to-end. It needs two pieces of
# infrastructure this repository does not have configured yet:
#   1. a development-variant build of sh.picompanion.debug.
#      CORRECTED (T315): this said an "EAS development build", gated on an
#      EXPO_TOKEN "currently unconfigured". Both halves are false now. The
#      secret has existed since T208, and `build-development-apk` no longer
#      uses EAS at all -- it assembles the APK with Gradle on the runner,
#      because the EAS free tier queued that build for 1h5m in front of a
#      1m54s build, twice per dispatch. Only `packaged-app-smoke` still
#      needs EXPO_TOKEN, for its release signing;
#   2. a booted Android emulator with Maestro installed
#      (apps/android/maestro/README.md's "Prerequisites" -- something the
#      harness has never provided and this workflow is the first attempt
#      at providing via reactivecircus/android-emulator-runner).
#      CORRECTED (T324): this said GitHub-hosted Linux runners' KVM support
#      for that action "has not been confirmed in this repository". It is
#      confirmed now, and the answer had two halves: /dev/kvm is present on
#      ubuntu runners, but the runner user is not in the `kvm` group, so the
#      action probed it, reported `ProbeKVM: This user doesn't have
#      permissions to use KVM (/dev/kvm)`, and silently ran the emulator
#      with `-accel off`. The `Enable KVM for the emulator` step in both
#      emulator jobs below adds the udev rule that grants access.
# CORRECTED (T318): this said "Until both exist, every shard job below
# no-ops with a logged notice instead of failing ... so this workflow is
# dry-run-safe today". Neither half survives. Requirement 1 exists --
# `build-development-apk` assembles the APK with Gradle and succeeded in
# 23m 09s on run 34392173679 -- and T315 removed `maestro-e2e`'s dry-run
# step along with the `configured` gate that selected it, so these shards
# fail loudly now rather than no-op. `packaged-app-smoke` still keeps its
# own EXPO_TOKEN dry run, which is the only part of that sentence that was
# still true. Requirement 2 remains genuinely unproven: no emulator has
# ever booted here, because every dispatch so far died before boot -- most
# recently on `Error: No device found matching --device pixel_8` (T317).
# This is a manual (workflow_dispatch) workflow, not part of the
# push/pull_request `ci.yml` gate: plan.md §15.4's "Required jobs from
# Phase 1 onward" list does not include an emulator-backed Maestro run,
# and nothing in this repository's CI has ever booted an Android emulator
# before.
#
# --- T43B2b: the phase-8 packaging exit gate's Android half -------------
#
# `packaged-app-smoke` below is a SEPARATE job from `maestro-e2e` above,
# added for docs/issues-from-plan.md's T43B2b ("pass the browser and
# device suites as the packaging exit gate"), not a fourth T37E flow or a
# change to the Phase 5 shard set. It answers a narrower, different
# question than `maestro-e2e` does:
#   - `maestro-e2e` (T37F, Phase 5): do all ten §14.4 scenarios pass on a
#     DEVELOPMENT-VARIANT build (`sh.picompanion.debug`, assembled by
#     Gradle on the runner with `APP_VARIANT=development`)?
#     CORRECTED (T315): this named the EAS `development` profile. That
#     profile still exists and `npm run android:development` still uses it;
#     this workflow does not.
#     CORRECTED (T311): this said that profile carried
#     `developmentClient: true`. It did, and that flag is why the first
#     real dispatch of this workflow (run 34369364166) failed all five
#     shards -- see T311 for the whole finding. The flag is gone: a
#     dev-client build has no embedded JS bundle and boots to the dev
#     launcher waiting for a Metro server, which neither this workflow
#     nor apps/android/maestro/README.md's local prerequisites ever
#     start. The profile still sets `APP_VARIANT: development`, so the
#     package it produces is unchanged.
#   - `packaged-app-smoke` (T43B2b, Phase 8): does the app launch at all
#     on the PACKAGED build (`sh.picompanion`, EAS `production-apk`
#     profile, `apps/android/eas.json` -- the same profile
#     `android-apk-release.yml` and plan.md §15.3 use for a real release)?
#
# CORRECTED (T207): this said `packaged-app-smoke` "cannot pass as
# written even with a valid `EXPO_TOKEN` and an emulator that boots
# perfectly" -- it installed `sh.picompanion` (the `production-apk`
# profile sets no `APP_VARIANT`, so `apps/android/app.config.ts`'s
# package expression resolves to the release id) and then ran a flow
# whose first line was a literal `appId: sh.picompanion.debug`, a
# package that job never installed. That wiring defect is fixed: every
# flow's `appId:` line (`apps/android/maestro/*.yaml`) is now the
# variable `${APP_ID}`, resolved at Maestro invocation time via the
# `-e APP_ID=<value>` flag `apps/android/e2e/harness/run-plan.ts`'s
# `buildRunPlan` adds to the `maestro test` argv -- the mechanism
# docs.maestro.dev's "Parameters and constants" page documents for
# exactly this "appId varies by target" case. `maestro-e2e` above never
# overrides it, so it keeps getting `run-plan.ts`'s `DEFAULT_APP_ID`
# (`sh.picompanion.debug`, the development variant's package --
# behaviorally unchanged). The `packaged-app-smoke` job below passes
# `APP_ID=sh.picompanion` before invoking `run-flow.ts`, so the flow it
# runs launches the exact package this job just installed.
# `scripts/ci/guard-app-id-package-pairing.mjs` is the CI check that a
# job's EAS profile and the package(s) its flows launch can never drift
# apart again -- it resolves each job's profile to a package from the
# real `eas.json`/`app.config.ts` and fails when a flow it runs would
# launch a different one; reverting this fix on any one flow file turns
# it red (see that guard's own test file for the proof). This job is
# still blocked by the missing `EXPO_TOKEN` secret disclosed further
# down and an unverified emulator boot (T208, owner-gated) -- that part
# of the original disclosure stands.
# It deliberately runs only `smoke.yaml` -- `apps/android/e2e/harness/
# shard-plan.ts`'s `NON_EXIT_GATE_FLOW_NAMES` already excludes `smoke`
# from the Phase 5 ten-flow set for exactly this reason: it is the one
# flow with no daemon dependency and no paired-host precondition, so it
# is the right size for "does the packaged artifact even boot," not "do
# all ten scenarios work," which stays `maestro-e2e`'s job.
#
# T43B2b's own brief scoped this task to `.github/workflows/ci.yml`
# only. This job lives here instead, in the file that already owns every
# other EAS-build-plus-emulator job in this repository, for one reason:
# putting a second, near-identical ~80-line EAS-build/download/emulator-
# boot block inside `ci.yml` (this workflow's `maestro-e2e` job already
# has one) would be exactly the kind of avoidable duplication CLAUDE.md
# warns against, with no collision risk to weigh against it -- P8-W10 is
# a solo wave; no other task in it touches `.github/workflows/*`. See
# T43B2b's own report for this reasoning spelled out, in case a future
# reader disagrees with where the line was drawn.
#
# Same disclosure as `maestro-e2e` above: this job has never executed
# end-to-end (no EXPO_TOKEN, no verified emulator boot here), dry-runs
# with a logged notice until EXPO_TOKEN is configured, and stays
# workflow_dispatch rather than joining the push/pull_request `ci.yml`
# gate, for the identical reason `maestro-e2e` gives above (plan.md
# §15.4's required-job list does not include an emulator-backed run).

on:
  workflow_dispatch:

concurrency:
  group: android-maestro-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Reads apps/android/maestro/shards.json once so the matrix below is
  # driven by the same file shard-plan.test.ts validates, rather than a
  # shard list typed a second time into this workflow.
  shard-matrix:
    name: shard-matrix
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.read.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read shard names from apps/android/maestro/shards.json
        id: read
        shell: bash
        run: |
          set -euo pipefail
          names="$(node -e "console.log(JSON.stringify(require('./apps/android/maestro/shards.json').shards.map(s => s.name)))")"
          echo "shards=$names" >> "$GITHUB_OUTPUT"

  # T315: the E2E APK is built ON THE RUNNER with Gradle, not on EAS.
  #
  # This job used to run `eas build --profile development --wait`. Measured
  # on the first two real dispatches: the EAS build itself took 1m54s, and
  # the FREE-TIER QUEUE took 1h5m in front of it. A free EAS plan runs one
  # build at a time, so a dispatch that also runs `packaged-app-smoke`
  # queues twice, serially, for a total wall-clock of two queues plus two
  # builds -- to produce one APK this job could assemble itself.
  #
  # Nothing about the E2E path needs EAS. EAS earns its place for the
  # PACKAGED build (`packaged-app-smoke` below still uses it) because that
  # job exists to exercise the real release artifact and its
  # Expo-managed release signing. This job installs
  # `sh.picompanion.debug` on a throwaway emulator, where the debug
  # keystore `expo prebuild` generates is exactly the right signing
  # material -- and it is generated on the runner, so no signing material
  # enters this repository (plan.md §15.3, T44B1).
  #
  # `assembleRelease`, NOT `assembleDebug`, and this is the same trap T311
  # documented one layer up. A React Native debug variant does not embed
  # the JS bundle; it expects a Metro dev server, which nothing in this
  # workflow starts, so every flow would fail at its first `launchApp`.
  # The release variant runs `expo export:embed` as part of the Gradle
  # build and embeds a Hermes bundle -- the same bundling step EAS runs,
  # and the one T314 fixed and now covers with `ci.yml`'s bundle smoke.
  # Expo's prebuild template signs `release` with the generated debug
  # keystore unless a real one is configured, so this assembles and
  # installs without any credential.
  #
  # `APP_VARIANT: development` is what makes `app.config.ts` resolve the
  # package to `sh.picompanion.debug`. It is also what
  # `scripts/ci/guard-app-id-package-pairing.mjs` now reads to pair this
  # job's package against the flows the shards run -- that guard used to
  # resolve a package only from an `eas build --profile`, which this job no
  # longer has, so it would have gone silently blind here exactly the way
  # T312 describes. It reads `APP_VARIANT` directly instead, which is
  # closer to the truth anyway: an EAS profile only ever mattered because
  # `eas.json` sets this same variable for it.
  build-development-apk:
    name: build-development-apk
    runs-on: ubuntu-latest
    # T318: measured, not guessed. This job took 23m 09s on run 34392173679
    # (Gradle's own `BUILD SUCCESSFUL in 21m 27s` plus checkout, npm ci and
    # prebuild); 60 minutes is roughly 2.5x that, enough for a cold Gradle
    # cache and slow enough to be reached only by something genuinely stuck.
    timeout-minutes: 60
    env:
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci

      # `expo prebuild` evaluates `app.config.ts`, and the Gradle build
      # runs `expo export:embed` over the full router graph -- which
      # imports every workspace package this app depends on through their
      # built `dist/`. Without these the bundle step fails the way
      # `android-tests` documents for its own typecheck.
      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      - name: Generate the native Android project
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android
          npx expo prebuild --platform android --no-install

      - name: Assemble the development-variant APK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Renamed to the basename every shard's `adb install` already expects,
      # so `maestro-e2e` below is unchanged by where the APK came from.
      - name: Stage the APK under the name the shards install
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          built="$(find apps/android/android/app/build/outputs/apk -name '*.apk' -print | head -n 1)"
          if [ -z "$built" ]; then
            echo "Gradle produced no APK under apps/android/android/app/build/outputs/apk."
            find apps/android/android/app/build/outputs -type f -print || true
            exit 1
          fi
          echo "Built: $built"
          apk_path="$RUNNER_TEMP/picompanion-debug.apk"
          cp "$built" "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      # `if-no-files-found: error` rather than the default warning: a
      # silently-empty artifact would let every shard below start, boot an
      # emulator, and fail at `adb install` with a missing-file error that
      # names neither this job nor the build it came from.
      - name: Upload the debug APK for every shard to reuse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picompanion-debug-apk
          path: ${{ steps.artifact.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 1

  maestro-e2e:
    name: maestro-e2e (${{ matrix.shard }})
    needs:
      - shard-matrix
      - build-development-apk
    runs-on: ubuntu-latest
    # T318, measured at T321: a Maestro flow that waits for an element that
    # never appears does not fail, it hangs, and `run-flow.ts` sets no
    # deadline of its own -- without this the job would sit at GitHub's
    # 360-minute default. Run 34413092055 supplied the numbers this used to
    # guess at: ~17 minutes of setup, boot and install, then 6m 10s of
    # flows. 60 rather than the original 45 because Maestro RETRIES driver
    # startup, so a shard whose flows both fail spends a multiple of the
    # per-attempt budget; 45 left a fully-failing shard within a minute or
    # two of the bound, which would have cost the cycle and the result.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T207 (folding in the P8-W10 merge gate's F4): neither Android job
      # built the daemon this workflow's own `run-flow.ts` spawns.
      # `packages/cli/bin/paseo` is `import '../dist/index.js'` — without
      # this, that import throws `MODULE_NOT_FOUND` and the isolated
      # daemon never comes up. Benign for `smoke.yaml` (no daemon
      # dependency) but latent for every other flow, and previously
      # invisible either way: `run-flow.ts` checked only the spawned
      # child's `error` event, never its exit code, so a dead daemon was
      # silently tolerated (apps/android/e2e/harness/daemon-exit-
      # policy.ts now closes that; see run-flow.ts).
      - name: Build the daemon (server, cli)
        run: |
          npm run build --workspace=@picompanion/server
          npm run build --workspace=@picompanion/cli

      # The APK build-development-apk above produced, not one of this
      # shard's own. `path: ${{ runner.temp }}` restores it to the same
      # `$RUNNER_TEMP/picompanion-debug.apk` the emulator step below
      # installs, because the artifact was uploaded under that basename.
      - name: Download the shared development APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: picompanion-debug-apk
          path: ${{ runner.temp }}

      - name: Install Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # apps/android/maestro/README.md's "Prerequisites" section, provided
      # here rather than by the harness (run-flow.ts never boots or
      # configures an emulator itself -- see that README's own "What T37D
      # proved, and what it did not"). One flow at a time, in the order
      # apps/android/maestro/shards.json lists for this shard --
      # shard-plan.test.ts proves that order never matters (every flow
      # starts with its own clearState: true launchApp), so this loop
      # could run its flows in any order and reach the same result.
      # T324: without this the emulator runs with `-accel off`. GitHub's
      # ubuntu runners ship /dev/kvm but the runner user is not in the `kvm`
      # group, so the action's own probe reports
      # `ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)`
      # and falls back to pure software emulation. Every symptom this
      # workflow has shown since the emulator first booted came from that:
      # 6-8 minute boots, a 4m30s `adb install`, `Failed to find
      # ColorBuffer`, adb exit 224, Maestro's driver missing its startup
      # budget, and finally System UI itself throwing
      # `ANR in com.android.phone` and covering the screen with an
      # "isn't responding" dialog -- which is what actually failed the
      # `connect-onboarding` assertion, not anything in the app.
      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # T317: `profile: pixel_8` was hardcoded here and all five shards of
      # run 34392173679 died 35s in with `Error: No device found matching
      # --device pixel_8` -- the runner image's avdmanager catalog does not
      # have that id. No committed file can know which device definitions a
      # GitHub runner image ships, so the profile is resolved against the
      # real catalog instead of asserted.
      - name: Resolve an AVD device profile this runner's catalog actually has
        id: avd
        run: node scripts/ci/run-resolve-avd-device-profile.mjs

      - name: Boot emulator, install the APK, and run this shard's flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ steps.avd.outputs.profile }}
          disable-animations: true
          # T319: measured, not guessed. Boot took 358363 ms on run
          # 34401219271 -- 60% of this action's 600s default, which is not a
          # margin when five shards boot at once on shared hardware. Raised
          # to 20 minutes so a slow boot costs waiting rather than a lost
          # 30-minute cycle (23m of Gradle assembly sits in front of it).
          emulator-boot-timeout: 1200
          # T320: ONE line, and it must stay one line. This action runs
          # each line of `script:` as its own `sh -c`, so no shell state
          # crosses lines and no construct may span them -- the previous
          # version's `for` loop and multi-line command substitution died
          # with `Syntax error: Unterminated quoted string` on run
          # 34407860092, after `adb install` had already succeeded. The loop
          # lives in apps/android/e2e/run-shard.ts instead.
          script: npx tsx apps/android/e2e/run-shard.ts ${{ matrix.shard }} "$RUNNER_TEMP/picompanion-debug.apk"

      # T322: a failing flow is only diagnosable if its evidence survives the
      # job. Maestro writes screenshots and the full view hierarchy under
      # `~/.maestro/tests/<timestamp>/` on the RUNNER (not the device), so
      # those outlive the emulator; `run-shard.ts` adds an `adb logcat` dump
      # per failing flow, which it must capture itself because this action
      # kills the emulator the moment its script returns. Without both,
      # `Assertion is false: id: connect-onboarding is visible` cannot be
      # told apart from an app that crashed on launch.
      - name: Upload Maestro debug output for this shard
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-debug-${{ matrix.shard }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/maestro-debug
          if-no-files-found: warn
          retention-days: 7

  # T43B2b -- see this file's header comment ("T43B2b: the phase-8
  # packaging exit gate's Android half") for why this is a separate job
  # from maestro-e2e above rather than an eleventh shard.
  packaged-app-smoke:
    name: packaged-app-smoke
    runs-on: ubuntu-latest
    # T318: this job blocks on `eas build --wait`, and on the free tier the
    # QUEUE dominates -- run 34392173679 spent 1h 05m queued against 1m 54s
    # building, and this job took 1h 06m wall-clock. 150 minutes leaves room
    # for a queue twice that long without ever letting a hung emulator run to
    # the 360-minute default.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T207 (folding in the P8-W10 merge gate's F4): neither Android job
      # built the daemon this workflow's own `run-flow.ts` spawns.
      # `packages/cli/bin/paseo` is `import '../dist/index.js'` — without
      # this, that import throws `MODULE_NOT_FOUND` and the isolated
      # daemon never comes up. Benign for `smoke.yaml` (no daemon
      # dependency) but latent for every other flow, and previously
      # invisible either way: `run-flow.ts` checked only the spawned
      # child's `error` event, never its exit code, so a dead daemon was
      # silently tolerated (apps/android/e2e/harness/daemon-exit-
      # policy.ts now closes that; see run-flow.ts).
      - name: Build the daemon (server, cli)
        run: |
          npm run build --workspace=@picompanion/server
          npm run build --workspace=@picompanion/cli

      - name: Check EAS credentials are configured
        id: eas-secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Same shape as maestro-e2e's "Build development APK on EAS" step
      # above and android-apk-release.yml's "Build Android APK on EAS"
      # step, but `apps/android/eas.json`'s `production-apk` profile
      # (package `sh.picompanion`, `distribution: store`) -- the real
      # packaged/release build, not `build-development-apk`'s
      # `sh.picompanion.debug` variant. EAS auto-manages signing
      # credentials for this profile the same way it would for a real
      # release build; no keystore is committed to this repository
      # (plan.md §15.3, T44B1's "signing material is not present in the
      # repository" criterion).
      - name: Build production APK on EAS
        id: eas_build
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          # T310: `npx eas-cli`, never `npx eas`. `eas` IS a real npm package
          # (0.1.0) and it has NO `bin`, so npx downloads it and dies with
          # `npm error could not determine executable to run` — which is
          # exactly how all six jobs of Maestro run 34368430903 failed, before
          # any EAS build started. The binary named `eas` is shipped BY
          # `eas-cli` (`bin = { eas: 'bin/run' }`), so the package name is what
          # npx needs. `expo/expo-github-action` has already installed
          # `eas-cli` into the workspace by this point, so this resolves
          # locally rather than re-downloading.
          build_json="$(npx eas-cli build --platform android --profile production-apk --non-interactive --wait --json)"
          echo "$build_json" > "$RUNNER_TEMP/eas-build.json"

          build_id="$(jq -r 'if type == "array" then .[0].id // empty else .id // empty end' "$RUNNER_TEMP/eas-build.json")"
          if [ -z "$build_id" ]; then
            echo "Failed to determine EAS build ID."
            cat "$RUNNER_TEMP/eas-build.json"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      # T313: `eas build --wait` prints `✖ Build failed` and exits 1 without
      # ever naming the reason -- the reason lives only on expo.dev, behind
      # the account. Run 34369364166's `packaged-app-smoke` spent 67 minutes
      # to produce exactly that one line, and nobody without the token could
      # tell a Gradle failure from a credentials problem from a timeout.
      # This step makes the next failure legible in the CI log itself.
      # `|| true` because a diagnostic that can fail the job it is diagnosing
      # replaces one useless log with two.
      - name: Explain the EAS build failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          cd apps/android
          echo "::group::Most recent EAS builds"
          npx eas-cli build:list --platform android --limit 3 --non-interactive --json || true
          echo "::endgroup::"

      - name: Resolve and download the packaged APK artifact
        id: artifact
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          build_view_json="$(npx eas-cli build:view '${{ steps.eas_build.outputs.build_id }}' --json)"
          echo "$build_view_json" > "$RUNNER_TEMP/eas-build-view.json"

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build-view.json")"
          if [ -z "$artifact_url" ]; then
            echo "Failed to determine APK artifact URL."
            cat "$RUNNER_TEMP/eas-build-view.json"
            exit 1
          fi

          apk_path="$RUNNER_TEMP/picompanion-packaged.apk"
          curl --fail --location --output "$apk_path" "$artifact_url"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Install Maestro CLI
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Only `smoke.yaml` -- see this file's header comment for why the
      # packaging exit gate's Android half is scoped to that one flow
      # rather than the Phase 5 ten-flow set. CORRECTED (T207): this
      # comment said the step "cannot succeed" because the flow it runs
      # was "pinned to `sh.picompanion.debug`" while the APK installed
      # above is `sh.picompanion`. `smoke.yaml`'s `appId:` line is now the
      # variable `${APP_ID}`, and `APP_ID=sh.picompanion` below resolves
      # it to the exact package `adb install` just installed --
      # `scripts/ci/guard-app-id-package-pairing.mjs` fails CI if this
      # job's profile and the package its flow launches ever drift apart
      # again.
      # T324 -- see the identical step in `maestro-e2e` above. Without this the emulator runs with `-accel off`. GitHub's
      # ubuntu runners ship /dev/kvm but the runner user is not in the `kvm`
      # group, so the action's own probe reports
      # `ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)`
      # and falls back to pure software emulation. Every symptom this
      # workflow has shown since the emulator first booted came from that:
      # 6-8 minute boots, a 4m30s `adb install`, `Failed to find
      # ColorBuffer`, adb exit 224, Maestro's driver missing its startup
      # budget, and finally System UI itself throwing
      # `ANR in com.android.phone` and covering the screen with an
      # "isn't responding" dialog -- which is what actually failed the
      # `connect-onboarding` assertion, not anything in the app.
      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # T317 -- see the identical step in `maestro-e2e` above for why the
      # device profile is resolved against the runner's real avdmanager
      # catalog rather than hardcoded.
      - name: Resolve an AVD device profile this runner's catalog actually has
        id: avd
        if: steps.eas-secrets.outputs.configured == 'true'
        run: node scripts/ci/run-resolve-avd-device-profile.mjs

      - name: Boot emulator, install the packaged APK, and run the smoke flow
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: ${{ steps.avd.outputs.profile }}
          disable-animations: true
          # T319: measured, not guessed. Boot took 358363 ms on run
          # 34401219271 -- 60% of this action's 600s default, which is not a
          # margin when five shards boot at once on shared hardware. Raised
          # to 20 minutes so a slow boot costs waiting rather than a lost
          # 30-minute cycle (23m of Gradle assembly sits in front of it).
          emulator-boot-timeout: 1200
          # T320 -- see the note on `maestro-e2e`'s script above. Each line
          # here is independently executable on purpose: they are two whole
          # commands, not one construct split across two lines, and no
          # variable or `set` option is expected to survive between them.
          script: |
            adb install -r "${{ steps.artifact.outputs.apk_path }}"
            APP_ID=sh.picompanion npx tsx apps/android/e2e/run-flow.ts smoke

      # T322 -- see the identical step in `maestro-e2e` above.
      - name: Upload Maestro debug output for the smoke flow
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-debug-packaged-app-smoke
          path: ~/.maestro/tests
          if-no-files-found: warn
          retention-days: 7

      - name: Dry run (EXPO_TOKEN not configured)
        if: steps.eas-secrets.outputs.configured == 'false'
        run: |
          echo "::notice::EXPO_TOKEN secret is not configured on this repository yet (see android-apk-release.yml)."
          echo "::notice::Skipping the packaged-app smoke run; this job is a dry run."
          echo "::notice::This job has never executed end-to-end -- see this file's header comment."
