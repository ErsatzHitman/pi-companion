name: Android Maestro E2E

# T37F (plan.md §14.4, §15.4; docs/issues-from-plan.md T37F) — the Phase 5
# exit gate: runs all ten §14.4 Maestro flows (apps/android/maestro/*.yaml,
# written by T37E1-T37E10) together, sharded, against a real emulator.
# This workflow owns shard scheduling and CI wiring only -- it writes no
# flow file and adds no second way to run one; every shard job below
# calls the exact same single-flow command T37D already built and
# documented (apps/android/maestro/README.md's "The one documented
# command"), once per flow the shard names in apps/android/maestro/
# shards.json (apps/android/e2e/harness/shard-plan.ts reads and validates
# that file; shard-plan.test.ts and flow-independence.test.ts prove the
# shard assignment and flow-order-independence claims below without a
# device).
#
# NOT PROVEN BY THIS FILE, and disclosed rather than hidden: this
# workflow has never executed end-to-end. It needs two pieces of
# infrastructure this repository does not have configured yet:
#   1. an EAS development build of sh.picompanion.debug -- the same
#      EXPO_TOKEN gate android-apk-release.yml already uses, and
#      currently unconfigured for the same reason (see that workflow's
#      own header and docs/frontend-data-migration.md §4.2-4.6);
#   2. a booted Android emulator with Maestro installed
#      (apps/android/maestro/README.md's "Prerequisites" -- something the
#      harness has never provided and this workflow is the first attempt
#      at providing via reactivecircus/android-emulator-runner, itself
#      unverified here: GitHub-hosted Linux runners' KVM support for that
#      action has not been confirmed in this repository).
# Until both exist, every shard job below no-ops with a logged notice
# instead of failing -- exactly like android-apk-release.yml's own
# EXPO_TOKEN gate -- so this workflow is dry-run-safe today and starts
# actually running the suite the moment both are wired up. This is a
# manual (workflow_dispatch) workflow, not part of the push/pull_request
# `ci.yml` gate: plan.md §15.4's "Required jobs from Phase 1 onward" list
# does not include an emulator-backed Maestro run, and nothing in this
# repository's CI has ever booted an Android emulator before.
#
# --- T43B2b: the phase-8 packaging exit gate's Android half -------------
#
# `packaged-app-smoke` below is a SEPARATE job from `maestro-e2e` above,
# added for docs/issues-from-plan.md's T43B2b ("pass the browser and
# device suites as the packaging exit gate"), not a fourth T37E flow or a
# change to the Phase 5 shard set. It answers a narrower, different
# question than `maestro-e2e` does:
#   - `maestro-e2e` (T37F, Phase 5): do all ten §14.4 scenarios pass on a
#     DEVELOPMENT-VARIANT build (`sh.picompanion.debug`, EAS
#     `development` profile)?
#     CORRECTED (T311): this said that profile carried
#     `developmentClient: true`. It did, and that flag is why the first
#     real dispatch of this workflow (run 34369364166) failed all five
#     shards -- see T311 for the whole finding. The flag is gone: a
#     dev-client build has no embedded JS bundle and boots to the dev
#     launcher waiting for a Metro server, which neither this workflow
#     nor apps/android/maestro/README.md's local prerequisites ever
#     start. The profile still sets `APP_VARIANT: development`, so the
#     package it produces is unchanged.
#   - `packaged-app-smoke` (T43B2b, Phase 8): does the app launch at all
#     on the PACKAGED build (`sh.picompanion`, EAS `production-apk`
#     profile, `apps/android/eas.json` -- the same profile
#     `android-apk-release.yml` and plan.md §15.3 use for a real release)?
#
# CORRECTED (T207): this said `packaged-app-smoke` "cannot pass as
# written even with a valid `EXPO_TOKEN` and an emulator that boots
# perfectly" -- it installed `sh.picompanion` (the `production-apk`
# profile sets no `APP_VARIANT`, so `apps/android/app.config.ts`'s
# package expression resolves to the release id) and then ran a flow
# whose first line was a literal `appId: sh.picompanion.debug`, a
# package that job never installed. That wiring defect is fixed: every
# flow's `appId:` line (`apps/android/maestro/*.yaml`) is now the
# variable `${APP_ID}`, resolved at Maestro invocation time via the
# `-e APP_ID=<value>` flag `apps/android/e2e/harness/run-plan.ts`'s
# `buildRunPlan` adds to the `maestro test` argv -- the mechanism
# docs.maestro.dev's "Parameters and constants" page documents for
# exactly this "appId varies by target" case. `maestro-e2e` above never
# overrides it, so it keeps getting `run-plan.ts`'s `DEFAULT_APP_ID`
# (`sh.picompanion.debug`, the `development` profile's package --
# behaviorally unchanged). The `packaged-app-smoke` job below passes
# `APP_ID=sh.picompanion` before invoking `run-flow.ts`, so the flow it
# runs launches the exact package this job just installed.
# `scripts/ci/guard-app-id-package-pairing.mjs` is the CI check that a
# job's EAS profile and the package(s) its flows launch can never drift
# apart again -- it resolves each job's profile to a package from the
# real `eas.json`/`app.config.ts` and fails when a flow it runs would
# launch a different one; reverting this fix on any one flow file turns
# it red (see that guard's own test file for the proof). This job is
# still blocked by the missing `EXPO_TOKEN` secret disclosed further
# down and an unverified emulator boot (T208, owner-gated) -- that part
# of the original disclosure stands.
# It deliberately runs only `smoke.yaml` -- `apps/android/e2e/harness/
# shard-plan.ts`'s `NON_EXIT_GATE_FLOW_NAMES` already excludes `smoke`
# from the Phase 5 ten-flow set for exactly this reason: it is the one
# flow with no daemon dependency and no paired-host precondition, so it
# is the right size for "does the packaged artifact even boot," not "do
# all ten scenarios work," which stays `maestro-e2e`'s job.
#
# T43B2b's own brief scoped this task to `.github/workflows/ci.yml`
# only. This job lives here instead, in the file that already owns every
# other EAS-build-plus-emulator job in this repository, for one reason:
# putting a second, near-identical ~80-line EAS-build/download/emulator-
# boot block inside `ci.yml` (this workflow's `maestro-e2e` job already
# has one) would be exactly the kind of avoidable duplication CLAUDE.md
# warns against, with no collision risk to weigh against it -- P8-W10 is
# a solo wave; no other task in it touches `.github/workflows/*`. See
# T43B2b's own report for this reasoning spelled out, in case a future
# reader disagrees with where the line was drawn.
#
# Same disclosure as `maestro-e2e` above: this job has never executed
# end-to-end (no EXPO_TOKEN, no verified emulator boot here), dry-runs
# with a logged notice until EXPO_TOKEN is configured, and stays
# workflow_dispatch rather than joining the push/pull_request `ci.yml`
# gate, for the identical reason `maestro-e2e` gives above (plan.md
# §15.4's required-job list does not include an emulator-backed run).

on:
  workflow_dispatch:

concurrency:
  group: android-maestro-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Reads apps/android/maestro/shards.json once so the matrix below is
  # driven by the same file shard-plan.test.ts validates, rather than a
  # shard list typed a second time into this workflow.
  shard-matrix:
    name: shard-matrix
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.read.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read shard names from apps/android/maestro/shards.json
        id: read
        shell: bash
        run: |
          set -euo pipefail
          names="$(node -e "console.log(JSON.stringify(require('./apps/android/maestro/shards.json').shards.map(s => s.name)))")"
          echo "shards=$names" >> "$GITHUB_OUTPUT"

  maestro-e2e:
    name: maestro-e2e (${{ matrix.shard }})
    needs: shard-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-matrix.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T207 (folding in the P8-W10 merge gate's F4): neither Android job
      # built the daemon this workflow's own `run-flow.ts` spawns.
      # `packages/cli/bin/paseo` is `import '../dist/index.js'` — without
      # this, that import throws `MODULE_NOT_FOUND` and the isolated
      # daemon never comes up. Benign for `smoke.yaml` (no daemon
      # dependency) but latent for every other flow, and previously
      # invisible either way: `run-flow.ts` checked only the spawned
      # child's `error` event, never its exit code, so a dead daemon was
      # silently tolerated (apps/android/e2e/harness/daemon-exit-
      # policy.ts now closes that; see run-flow.ts).
      - name: Build the daemon (server, cli)
        run: |
          npm run build --workspace=@picompanion/server
          npm run build --workspace=@picompanion/cli

      - name: Check EAS credentials are configured
        id: eas-secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Same shape as android-apk-release.yml's "Build Android APK on EAS"
      # step, but the `development` profile (sh.picompanion.debug, the
      # package apps/android/maestro/README.md's prerequisites require)
      # rather than `production-apk`.
      #
      # T311: that profile must NOT set `developmentClient: true`. It did
      # until this fix, and every shard of run 34369364166 died here in
      # 18 seconds with "we detected that you don't have expo-dev-client
      # installed for your project" -- `apps/android/package.json`
      # declares no such dependency, so the build was refused before it
      # started. Installing that dependency would be the wrong repair: a
      # dev-client APK carries no embedded JS bundle and boots to the dev
      # launcher waiting for a Metro dev server, and nothing in this job
      # starts one. What this job needs, and now gets, is a standalone
      # APK of the development VARIANT -- `APP_VARIANT: development`
      # still resolves `app.config.ts` to `sh.picompanion.debug`, which
      # is the package `run-plan.ts`'s DEFAULT_APP_ID launches.
      - name: Build development APK on EAS
        id: eas_build
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          # T310: `npx eas-cli`, never `npx eas`. `eas` IS a real npm package
          # (0.1.0) and it has NO `bin`, so npx downloads it and dies with
          # `npm error could not determine executable to run` — which is
          # exactly how all six jobs of Maestro run 34368430903 failed, before
          # any EAS build started. The binary named `eas` is shipped BY
          # `eas-cli` (`bin = { eas: 'bin/run' }`), so the package name is what
          # npx needs. `expo/expo-github-action` has already installed
          # `eas-cli` into the workspace by this point, so this resolves
          # locally rather than re-downloading.
          build_json="$(npx eas-cli build --platform android --profile development --non-interactive --wait --json)"
          echo "$build_json" > "$RUNNER_TEMP/eas-build.json"

          build_id="$(jq -r 'if type == "array" then .[0].id // empty else .id // empty end' "$RUNNER_TEMP/eas-build.json")"
          if [ -z "$build_id" ]; then
            echo "Failed to determine EAS build ID."
            cat "$RUNNER_TEMP/eas-build.json"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Resolve and download the debug APK artifact
        id: artifact
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          build_view_json="$(npx eas-cli build:view '${{ steps.eas_build.outputs.build_id }}' --json)"
          echo "$build_view_json" > "$RUNNER_TEMP/eas-build-view.json"

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build-view.json")"
          if [ -z "$artifact_url" ]; then
            echo "Failed to determine APK artifact URL."
            cat "$RUNNER_TEMP/eas-build-view.json"
            exit 1
          fi

          apk_path="$RUNNER_TEMP/picompanion-debug.apk"
          curl --fail --location --output "$apk_path" "$artifact_url"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Install Maestro CLI
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # apps/android/maestro/README.md's "Prerequisites" section, provided
      # here rather than by the harness (run-flow.ts never boots or
      # configures an emulator itself -- see that README's own "What T37D
      # proved, and what it did not"). One flow at a time, in the order
      # apps/android/maestro/shards.json lists for this shard --
      # shard-plan.test.ts proves that order never matters (every flow
      # starts with its own clearState: true launchApp), so this loop
      # could run its flows in any order and reach the same result.
      - name: Boot emulator, install the APK, and run this shard's flows
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "${{ steps.artifact.outputs.apk_path }}"
            flows="$(node -e "
              const cfg = require('./apps/android/maestro/shards.json');
              const shard = cfg.shards.find((s) => s.name === '${{ matrix.shard }}');
              if (!shard) { console.error('unknown shard: ${{ matrix.shard }}'); process.exit(1); }
              console.log(shard.flows.join(' '));
            ")"
            for flow in $flows; do
              echo "::group::flow: $flow"
              npx tsx apps/android/e2e/run-flow.ts "$flow"
              echo "::endgroup::"
            done

      - name: Dry run (EXPO_TOKEN not configured)
        if: steps.eas-secrets.outputs.configured == 'false'
        run: |
          echo "::notice::EXPO_TOKEN secret is not configured on this repository yet (see android-apk-release.yml)."
          echo "::notice::Skipping this shard's emulator run; matrix shard ${{ matrix.shard }} is a dry run."
          echo "::notice::This workflow has never executed end-to-end -- see its own header comment."

  # T43B2b -- see this file's header comment ("T43B2b: the phase-8
  # packaging exit gate's Android half") for why this is a separate job
  # from maestro-e2e above rather than an eleventh shard.
  packaged-app-smoke:
    name: packaged-app-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T207 (folding in the P8-W10 merge gate's F4): neither Android job
      # built the daemon this workflow's own `run-flow.ts` spawns.
      # `packages/cli/bin/paseo` is `import '../dist/index.js'` — without
      # this, that import throws `MODULE_NOT_FOUND` and the isolated
      # daemon never comes up. Benign for `smoke.yaml` (no daemon
      # dependency) but latent for every other flow, and previously
      # invisible either way: `run-flow.ts` checked only the spawned
      # child's `error` event, never its exit code, so a dead daemon was
      # silently tolerated (apps/android/e2e/harness/daemon-exit-
      # policy.ts now closes that; see run-flow.ts).
      - name: Build the daemon (server, cli)
        run: |
          npm run build --workspace=@picompanion/server
          npm run build --workspace=@picompanion/cli

      - name: Check EAS credentials are configured
        id: eas-secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Same shape as maestro-e2e's "Build development APK on EAS" step
      # above and android-apk-release.yml's "Build Android APK on EAS"
      # step, but `apps/android/eas.json`'s `production-apk` profile
      # (package `sh.picompanion`, `distribution: store`) -- the real
      # packaged/release build, not the `development` profile's
      # `sh.picompanion.debug` variant. EAS auto-manages signing
      # credentials for this profile the same way it would for a real
      # release build; no keystore is committed to this repository
      # (plan.md §15.3, T44B1's "signing material is not present in the
      # repository" criterion).
      - name: Build production APK on EAS
        id: eas_build
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          # T310: `npx eas-cli`, never `npx eas`. `eas` IS a real npm package
          # (0.1.0) and it has NO `bin`, so npx downloads it and dies with
          # `npm error could not determine executable to run` — which is
          # exactly how all six jobs of Maestro run 34368430903 failed, before
          # any EAS build started. The binary named `eas` is shipped BY
          # `eas-cli` (`bin = { eas: 'bin/run' }`), so the package name is what
          # npx needs. `expo/expo-github-action` has already installed
          # `eas-cli` into the workspace by this point, so this resolves
          # locally rather than re-downloading.
          build_json="$(npx eas-cli build --platform android --profile production-apk --non-interactive --wait --json)"
          echo "$build_json" > "$RUNNER_TEMP/eas-build.json"

          build_id="$(jq -r 'if type == "array" then .[0].id // empty else .id // empty end' "$RUNNER_TEMP/eas-build.json")"
          if [ -z "$build_id" ]; then
            echo "Failed to determine EAS build ID."
            cat "$RUNNER_TEMP/eas-build.json"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Resolve and download the packaged APK artifact
        id: artifact
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android

          build_view_json="$(npx eas-cli build:view '${{ steps.eas_build.outputs.build_id }}' --json)"
          echo "$build_view_json" > "$RUNNER_TEMP/eas-build-view.json"

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build-view.json")"
          if [ -z "$artifact_url" ]; then
            echo "Failed to determine APK artifact URL."
            cat "$RUNNER_TEMP/eas-build-view.json"
            exit 1
          fi

          apk_path="$RUNNER_TEMP/picompanion-packaged.apk"
          curl --fail --location --output "$apk_path" "$artifact_url"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Install Maestro CLI
        if: steps.eas-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Only `smoke.yaml` -- see this file's header comment for why the
      # packaging exit gate's Android half is scoped to that one flow
      # rather than the Phase 5 ten-flow set. CORRECTED (T207): this
      # comment said the step "cannot succeed" because the flow it runs
      # was "pinned to `sh.picompanion.debug`" while the APK installed
      # above is `sh.picompanion`. `smoke.yaml`'s `appId:` line is now the
      # variable `${APP_ID}`, and `APP_ID=sh.picompanion` below resolves
      # it to the exact package `adb install` just installed --
      # `scripts/ci/guard-app-id-package-pairing.mjs` fails CI if this
      # job's profile and the package its flow launches ever drift apart
      # again.
      - name: Boot emulator, install the packaged APK, and run the smoke flow
        if: steps.eas-secrets.outputs.configured == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "${{ steps.artifact.outputs.apk_path }}"
            APP_ID=sh.picompanion npx tsx apps/android/e2e/run-flow.ts smoke

      - name: Dry run (EXPO_TOKEN not configured)
        if: steps.eas-secrets.outputs.configured == 'false'
        run: |
          echo "::notice::EXPO_TOKEN secret is not configured on this repository yet (see android-apk-release.yml)."
          echo "::notice::Skipping the packaged-app smoke run; this job is a dry run."
          echo "::notice::This job has never executed end-to-end -- see this file's header comment."
