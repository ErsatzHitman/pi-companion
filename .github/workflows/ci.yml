name: CI

# T17A: authored from scratch for this repository's own workspace layout
# (plan.md §15.4). The reference `D:\paseo` workflow (`Paseo v0.3.0-beta.2`,
# AGPL-3.0-or-later) was consulted only as behavioral documentation of the
# required job list and path-filter approach — no reference workflow content
# was copied.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  # --- Routing -----------------------------------------------------------

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Pushes to main, the merge queue, and manual dispatch always run every
      # contract. On pull requests, a change to the routing/workspace/CI
      # definitions themselves also forces a full run, so no contract can be
      # silently un-checked by editing its own filter.
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing == 'true' || steps.filter.outputs.workspace == 'true' || steps.filter.outputs.ci == 'true' }}
      protocol: ${{ steps.filter.outputs.protocol }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend-core: ${{ steps.filter.outputs.frontend-core }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      packaging: ${{ steps.filter.outputs.packaging }}
      docker: ${{ steps.filter.outputs.docker }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `node --test scripts/ci/*.test.mjs` below includes T303's real-git
          # fixture in `guard-format-check-per-commit.test.mjs`, which resolves
          # the commit that ADDED a bracketed Expo Router path and then asks
          # for that commit's PARENT. On the default shallow checkout there is
          # exactly one commit, `git log --diff-filter=A` resolves it as the
          # add commit for every path, and `git rev-parse <it>^` fails with
          # `unknown revision` — which is how this job first went red, at
          # `a94e79b`. Same `fetch-depth: 0` the two range guards below already
          # take, and for the same reason: a history-dependent check needs the
          # history to be present, and skipping it on a shallow checkout would
          # make it a check that cannot fail on CI.
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: .github/ci-paths.yml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate CI guard scripts
        run: node --test scripts/ci/*.test.mjs

  # --- Legacy/repo-invariant guards (always run, unconditional) ----------
  #
  # These check invariants that must hold at every commit regardless of what
  # changed, so they are not gated by the `changes` filters.

  guard-legacy-paths:
    name: guard / no packages/app or legacy import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on any packages/app path or legacy @getpaseo/import import
        run: node scripts/ci/run-guard-no-legacy-app-tree.mjs

  guard-android-no-web-files:
    name: guard / apps/android has no .web.* files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on any apps/android/**/*.web.* file
        run: node scripts/ci/run-guard-no-android-web-files.mjs

  # T310: `npx eas` named the BINARY, not the package. npx resolves package
  # names, the npm package literally called `eas` is an unrelated squat with
  # no bin, and all six jobs of Maestro run 34368430903 died on `npm error
  # could not determine executable to run` before any EAS build started.
  # This guard reads package-lock.json's own bin maps, so it can say
  # statically which npx targets will actually resolve after `npm ci`.
  guard-npx-binary-package:
    name: guard / every npx target is a resolvable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on an npx target no dependency or registration provides
        run: node scripts/ci/run-guard-npx-binary-package.mjs

  # T316: apps/android/modules/share-intent shipped without an Android
  # compileSdk and was unbuildable from the day it was written. Nothing
  # noticed because nothing ran Gradle: `android-tests` runs `expo prebuild
  # --no-install`, which generates the native project without configuring
  # it, and EAS never reached the assemble step. The real assemble in
  # android-maestro-e2e.yml is the authoritative check; this is the static
  # companion that costs milliseconds on every push.
  guard-local-expo-module-sdk:
    name: guard / local Expo modules establish an Android compileSdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on a local Expo module with no compileSdk
        run: node scripts/ci/run-guard-local-expo-module-sdk.mjs

  guard-android-no-duplicate-permission-state:
    name: guard / apps/android has one permission-recovery vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # T60D: apps/android/src/features/composer/permission-recovery.ts is the
      # sole permission-state ("denied-permanently" et al.) vocabulary this
      # app may declare — fails if a second one reappears.
      - name: Fail on a second private permission-state union under apps/android/src
        run: node scripts/ci/run-guard-no-duplicate-permission-state.mjs

  guard-maestro-no-production-daemon-port:
    name: guard / apps/android/maestro never names port 6767
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # T37D: no apps/android/maestro/*.yaml flow or config file may name
      # the production daemon port 6767, in any form (see
      # apps/android/maestro/README.md's "Isolation" section).
      - name: Fail on any apps/android/maestro/*.yaml file naming the production daemon port
        run: node scripts/ci/run-guard-no-production-daemon-port.mjs

  # T92: T89 built scripts/ci/run-guard-no-wave-self-revert.mjs and
  # deliberately left it unwired -- over the repository's ENTIRE history it
  # reports 43 findings across 13 files, all legacy (oxfmt reformats, old
  # T27A1/T30B/T31B fix-ups) that a whole-history scan would wrongly fail
  # every run on. The range-scoped form is already clean
  # (`24db6bb..HEAD` -> OK), so this job scopes every run to ONLY the
  # commits this run itself introduces -- never full history, and never a
  # suppression list (a suppression list would also hide a real future
  # finding). That range is computed as `merge-base(base, HEAD)..HEAD`:
  #   - pull_request / merge_group: base is the target branch tip recorded
  #     on the event, so the range is exactly the PR's/queue entry's own
  #     commits.
  #   - push (a direct push or a merge landing on main): base is
  #     `github.event.before`, the branch tip immediately before this push,
  #     so the range is exactly the commits this push introduced -- this is
  #     what makes the job meaningful (and provably green) on `main` too,
  #     not just on pull requests.
  #   - anything else (workflow_dispatch, or a base SHA this checkout can't
  #     resolve -- e.g. a force-push's stale `before`): falls back to just
  #     this run's own tip commit (`HEAD^..HEAD`) rather than full history.
  # This would have been the only automated catch for P5-W22's silent
  # revert (docs/issues-from-plan.md's T92, proven against `acacff2^..9ac1184`).
  guard-no-wave-self-revert:
    name: guard / no wave self-revert (this run's own range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The guard walks commit-by-commit diffs over the resolved range,
          # and the range's base commit must be present locally for
          # `git merge-base` to resolve it -- a shallow checkout would make
          # every base SHA unreachable and silently collapse every range to
          # the HEAD^..HEAD fallback below.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve this run's own commit range
        id: range
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              base_ref="${{ github.event.merge_group.base_sha }}"
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          if [ -n "$base_ref" ] && git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            merge_base="$(git merge-base "$base_ref" HEAD)"
          else
            # No usable base (workflow_dispatch, a branch's very first push,
            # or a force-push whose recorded `before` is no longer
            # reachable): scope to just this run's own tip commit instead
            # of falling back to full history, which would resurface the 43
            # pre-existing legacy findings documented above the job.
            merge_base="HEAD^"
          fi

          echo "range=${merge_base}..HEAD" >> "$GITHUB_OUTPUT"
          echo "Resolved range: ${merge_base}..HEAD"

      - name: Fail if a commit in this run's own range reintroduces text an earlier commit in that range deleted from the same file
        run: node scripts/ci/run-guard-no-wave-self-revert.mjs "${{ steps.range.outputs.range }}"

  # T137: a tip-only `format:check` cannot see a commit that is format-red in
  # the MIDDLE of a range when a later commit in that same range happens to
  # reformat the same file back to green without saying so -- exactly what
  # happened at the real P6-W10 gate (`4a23d89` red, `9b01176` silently fixed
  # it, `d89058c` tip green; every wave-end gate that ran `format:check` at
  # the tip passed throughout). This job re-checks EVERY commit this run
  # itself introduces against its own post-commit content, using the SAME
  # `merge-base(base, HEAD)..HEAD` range-resolution recipe as
  # `guard-no-wave-self-revert` above (same rationale: never full history,
  # which would rerun oxfmt over historical commits forever and eventually
  # resurface legacy findings nobody in this run can fix -- see
  # scripts/ci/guard-format-check-per-commit.mjs's module header for the
  # full cost/bound writeup and the wall-clock measured against the real
  # 68f899f..d89058c reproduction).
  guard-format-check-per-commit:
    name: guard / format:check per commit (this run's own range)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Same reason as guard-no-wave-self-revert above: the range's base
          # commit must be reachable for `git merge-base` to resolve it.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # The guard needs the PINNED oxfmt binary on disk (node_modules/oxfmt) --
      # it deliberately refuses to fall back to an unpinned `npx oxfmt`, so
      # node_modules must actually be installed before it runs.
      - run: npm ci

      - name: Resolve this run's own commit range
        id: range
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base_ref="${{ github.event.pull_request.base.sha }}"
              ;;
            merge_group)
              base_ref="${{ github.event.merge_group.base_sha }}"
              ;;
            push)
              base_ref="${{ github.event.before }}"
              ;;
            *)
              base_ref=""
              ;;
          esac

          if [ -n "$base_ref" ] && git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            merge_base="$(git merge-base "$base_ref" HEAD)"
          else
            # No usable base (workflow_dispatch, a branch's very first push,
            # or a force-push whose recorded `before` is no longer
            # reachable): scope to just this run's own tip commit instead of
            # falling back to full history.
            merge_base="HEAD^"
          fi

          echo "range=${merge_base}..HEAD" >> "$GITHUB_OUTPUT"
          echo "Resolved range: ${merge_base}..HEAD"

      - name: Fail if any commit in this run's own range is format-red as of its own content
        run: node scripts/ci/run-guard-format-check-per-commit.mjs "${{ steps.range.outputs.range }}"

  # --- Format / lint / typecheck (cheap, always run) ----------------------

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Check formatting
        run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # T60B: apps/android and apps/web must declare, in their OWN
      # package.json, every `@picompanion/*` workspace package their source
      # actually imports as a value — npm workspace hoisting resolves the
      # import either way, so this catches drift before it becomes the kind
      # of near-miss recorded in this guard's own header comment, rather than
      # after a build-ordering or lockfile change stops masking it. T251
      # widened the same check to every `packages/*` with a `src` directory,
      # each checked against its OWN manifest, for the identical reason.
      # Runs here (not in the unconditional guard-* jobs above) because it
      # needs `npm ci` to have already produced a lockfile-consistent tree to
      # audit against, and this job already pays that cost unconditionally.
      - name: Guard / every workspace declares the packages it imports
        run: node scripts/ci/run-guard-declared-workspace-deps.mjs

      # Backend packages resolve each other through built `dist/*.d.ts`
      # output (package.json `exports.types`), not source, so the dependency
      # chain must be built before typechecking downstream packages.
      - name: Build backend dependency chain (protocol -> relay -> highlight -> client -> server -> cli)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/client
          npm run build --workspace=@picompanion/server
          npm run build --workspace=@picompanion/cli
          npm run build --workspace=@picompanion/bridge

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present

      # T171: this step's @picompanion/server pack deliberately asserts only
      # that `npm pack` itself succeeds, NOT that the tarball carries the
      # bundled web UI (`dist/server/web-ui/`) — this job's own "Build
      # backend dependency chain" step above never builds `apps/web` or runs
      # `scripts/build-daemon-web-ui.mjs`, so that tarball never contains a
      # web-ui bundle, real or otherwise, and asserting its presence here
      # would fail on every run regardless of whether the real packaging
      # path (below) is healthy. That real assertion — run after `apps/web`
      # IS built and bundled in — is `guard-daemon-web-ui-bundled` in the
      # `daemon-package-dry-run` job below; see
      # scripts/ci/guard-daemon-web-ui-bundled.mjs for what it checks and
      # why.
      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/protocol
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/client
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/server
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/highlight
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/cli

  # --- protocol/client build and tests ------------------------------------

  protocol-client-tests:
    name: protocol-client-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.protocol == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build client dependency chain
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/client

      - name: Run protocol tests
        run: npm run test --workspace=@picompanion/protocol

      - name: Run client tests
        run: npm run test --workspace=@picompanion/client

      - name: Run highlight tests
        run: npm run test --workspace=@picompanion/highlight

  # T44A4: `@picompanion/relay` has a real `"test": "vitest run"` script and
  # 7 test files (34 tests) — see `scripts/ci/guard-workspace-test-
  # coverage.mjs`'s header for how this gap was measured. `relay` declares
  # no workspace dependencies of its own, but one of its tests still needs
  # a build: `src/dist-handshake-parity.test.ts` resolves
  # `../dist/encrypted-channel.js` and asserts on its BUILT text, and
  # `packages/relay/dist` is gitignored, so a clean `npm ci` checkout has
  # none. That test self-heals by shelling `npm run build` out from inside
  # vitest, under vitest's default 5000 ms per-test timeout — a
  # timing-dependent first-run path that must not be CI's normal one. The
  # explicit build step below makes `dist/` exist so the self-heal never
  # runs, matching how `cli-tests` and the `typecheck` job build first.
  # (CORRECTED at the P9-W4 merge gate: this said "so no build step is
  # needed before `vitest run` — it transforms TypeScript on the fly", and
  # offered a local `npm run test` run as direct verification. That run
  # passed off the stale gitignored `dist/` every local checkout carries,
  # which CLAUDE.md names as the standing first suspect whenever a local
  # build agrees where CI would not.)
  #
  # `relay`'s two heaviest test files do stay skipped here, but not for the
  # reason first recorded. `live-relay.e2e.test.ts` really is gated on
  # `RUN_LIVE_RELAY_E2E === "1"`. `e2e.test.ts` is not: its real gate is
  # `(FORCE_RELAY_E2E === "1" || nodeMajor < 25) && wranglerCliPath !== null`,
  # and this workflow pins `NODE_VERSION: "22"`, so the env-var clause is
  # inert and the ONLY thing keeping that file skipped is that `wrangler`
  # is absent from the tree (declared in no package.json, not present in
  # package-lock.json). Adding `wrangler` as a devDependency would arm a
  # 90 s-startup wrangler dev server in this job, silently. (CORRECTED at
  # the P9-W4 merge gate: this said both files "self-skip unless an opt-in
  # env var this job never sets is present", which is true of one of them.)
  relay-tests:
    name: relay-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # `src/dist-handshake-parity.test.ts` asserts on `dist/encrypted-channel.js`,
      # which is gitignored and therefore absent on a clean checkout. Building
      # here keeps that test off its in-test `npm run build` self-heal path,
      # which would run under vitest's default 5000 ms timeout.
      - name: Build relay
        run: npm run build --workspace=@picompanion/relay

      - name: Run relay tests
        run: npm run test --workspace=@picompanion/relay

  # --- frontend-core unit and contract tests ------------------------------

  frontend-core-tests:
    name: frontend-core-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend-core == 'true') }}
    runs-on: ubuntu-latest
    steps: &frontend_core_test_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # frontend-core declares @picompanion/client and @picompanion/protocol.
      # This job runs `npm run typecheck` directly, which does NOT run
      # frontend-core's own build script, so the chain must be built here.
      # Building only protocol left six jobs red on every push until T195.
      - name: Build frontend-core's declared dependency chain (protocol -> relay -> client)
        run: npm run build --workspace=@picompanion/client

      - name: Typecheck frontend-core
        run: npm run typecheck --workspace=@picompanion/frontend-core

      - name: Run frontend-core unit and contract tests
        run: npm run test --workspace=@picompanion/frontend-core

  # T49: frontend-core's suite on Windows -- our daemon's primary host
  # (plan.md §15.4) but frontend-core had no Windows coverage at all before
  # this, so a path-separator or line-ending bug here could ship silently.
  # Same YAML-anchor pattern as server-tests-ubuntu/server-tests-windows.
  frontend-core-tests-windows:
    name: frontend-core-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend-core == 'true') }}
    runs-on: windows-latest
    steps: *frontend_core_test_steps

  # --- design-tokens tests -------------------------------------------------
  #
  # T49: design-tokens had no test job on any platform before this, so
  # contrast.test.ts (T54A1's WCAG AA guard, added after a real-browser axe
  # run found the palette failing WCAG AA) gated nothing in CI. The package
  # has no workspace dependencies and its `test` script runs straight
  # against source (no build step required first). One platform is enough
  # per the task's acceptance criteria -- the assertions are pure color-math,
  # not platform-sensitive -- so this runs on ubuntu-latest only.

  design-tokens-tests:
    name: design-tokens-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.frontend-core == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Run design-tokens tests
        run: npm run test --workspace=@picompanion/design-tokens

  # --- web typecheck, browser components, and Playwright E2E --------------
  #
  # apps/web is filled by T15 (blank shell) and T25A/T31 (components,
  # Playwright suite, plan.md §14.5 performance budgets). The Playwright
  # steps below are not yet sharded -- see the T31D note further down for
  # why they were never actually running until now.

  web-tests:
    name: web-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # apps/web also depends on @picompanion/highlight (T30B2's read-only
      # syntax tokenizing via the `./lezer-only` export, T30B3's lazily
      # imported CodeMirror highlight style off the main entry point), and
      # both resolve through the package's built `dist/`, so it must be
      # built here too or apps/web's typecheck cannot see either entry.
      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T122: apps/web also resolves @picompanion/client through its built
      # `dist/` (package.json `exports`), same as highlight above -- it is
      # imported as a VALUE (not just types) by production code
      # (daemon-client-context.tsx) and by fixture tests
      # (daemon-agent-turn-client.fixture.test.ts among others). Before this
      # step existed, this job never built that package at all: on a truly
      # clean checkout `dist/` does not exist (it is gitignored), so those
      # imports fail to resolve outright; and on any checkout where a stale
      # `dist/` happened to already be present, tests ran against whatever
      # code that stale `dist/` contained, not the commit under test -- proven
      # at P6-W6 when mutating `DaemonClient.setFollowUpMode` to hardcode its
      # mode left `daemon-agent-turn-client.fixture.test.ts` passing against a
      # stale `dist/` and failing once it was rebuilt (see T122's report and
      # the doc comment on `DaemonTurnClient`'s queue-mode trio in
      # `daemon-agent-turn-client.ts` for the exact repro). Building the same
      # protocol -> relay -> highlight -> client chain the mandatory
      # `typecheck` job already builds removes both failure modes: a fresh
      # checkout always gets a `dist/` built from the commit under test.
      - name: Build @picompanion/client (protocol -> relay -> client chain)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/client

      - name: Typecheck apps/web
        run: npm run typecheck --workspace=@picompanion/web

      - name: Run apps/web unit and component tests
        run: npm run test --workspace=@picompanion/web

      # This build's own dist/ is not what Playwright serves (see T43B2b
      # note below) -- kept as its own step so a build break in apps/web
      # itself is attributed here, before the slower E2E run, rather than
      # surfacing only inside global-setup's rebuild.
      - name: Build apps/web
        run: npm run build --workspace=@picompanion/web

      # T31D: these two steps used to be guarded on
      # `hashFiles('apps/web/playwright.config.ts') != ''`, but the config
      # has always lived at `apps/web/e2e/playwright.config.ts` -- that
      # guard evaluated false on every run since T31 landed, so neither
      # step had ever actually executed. Unguarded now: the config (and
      # the `test:e2e` script it backs, `apps/web/package.json`) always
      # exists in this repository, so there is nothing left to gate on.
      # `npm run test:e2e` runs every `apps/web/e2e/**/*.spec.ts` file,
      # including `performance-budgets.spec.ts` (plan.md §14.5's CI gate).
      # T199: apps/web/e2e/fixtures/daemon.ts imports
      # @picompanion/server/dist/server/server/exports.js as a VALUE, and no
      # step in this job ever built that package. On a clean npm ci checkout
      # dist/ does not exist (it is gitignored), so the Playwright run died
      # during module resolution before a single spec executed. Invisible
      # until T194/T195 unmasked it: this job used to fail earlier, at the
      # frontend-core build.
      #
      # T43B2b: `npm run test:e2e` below rebuilds apps/web and every
      # workspace dependency a second time, inside Playwright's
      # `global-setup.ts` (`fixtures/preview-server.ts`'s
      # `buildWorkspaceDependencies` + `runBuildDaemonWebUi`) -- that
      # second build is the one actually served to the browser, and it
      # now runs through `scripts/build-daemon-web-ui.mjs`, the exact
      # script every packaging path uses (T43A1), producing
      # `packages/server/dist/server/web-ui`. So this job's own "Build
      # apps/web" and "Build @picompanion/server" steps above/below are
      # deliberately redundant with what the E2E run does internally --
      # they exist to fail fast, with a shorter, clearer log, on an
      # ordinary compile break, before paying the ~2-3 minute cost of
      # driving a real browser. The suite that actually runs against
      # `apps/web` code is the one global-setup builds, not these two
      # steps' output. See `apps/web/e2e/fixtures/preview-server.ts`'s
      # module doc for why this fixture serves the packaged bundle
      # (`packages/server/dist/server/web-ui`) rather than a standalone
      # `apps/web/dist` copy, and why it stops short of a single daemon-
      # served origin for every spec.
      - name: Build @picompanion/server (the E2E fixture's daemon)
        run: npm run build --workspace=@picompanion/server

      # T44A2: apps/web/e2e/tsconfig.json existed before this task and was
      # never run through tsc anywhere in this repository -- the workspace
      # "typecheck" script only covers apps/web/tsconfig.json's own
      # "src/**/*" include, and Playwright's own transform of .spec.ts files
      # strips types rather than checking them. Without this step,
      # accessibility.spec.ts's `Record<SweptRoutePath, RouteSweep>` sweep
      # table -- the compile-time half of keeping every route's axe check in
      # sync with fixtures/route-coverage-manifest.ts, see that spec's own
      # doc comment -- would never actually be checked in CI.
      #
      # THIS STEP'S POSITION IS LOAD-BEARING: it must stay AFTER the
      # `Build @picompanion/server` step above. `e2e/fixtures/daemon.ts`
      # imports `@picompanion/server` as a value and a type, and that
      # package exposes types only through `dist/server/server/exports.d.ts`,
      # which is gitignored -- `tsc --traceResolution` shows that build
      # output is the ONLY resolution path. Placed before the build (where
      # P9-W2 first landed it), this step exits 2 with `TS2307` on every
      # clean checkout while passing on any workstation carrying a stale
      # `dist/`, and its failure would stop the job before `Run Playwright
      # E2E` -- the axe sweep this task exists to add -- ever ran. That is
      # exactly the T199 trap the comment above `Install Playwright
      # browsers` narrates, for the same package. Moved here at the P9-W2
      # merge gate.
      - name: Typecheck apps/web/e2e
        run: npx tsc -p apps/web/e2e/tsconfig.json --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e --workspace=@picompanion/web

  # T49: apps/web's unit/component suite on Windows -- our daemon's primary
  # host (plan.md §15.4) but this suite had no Windows coverage at all
  # before this. Deliberately narrower than web-tests above: only the
  # jsdom unit/component run, not typecheck/build/Playwright, which stay
  # Linux-only (owned by web-tests, T31D) to keep the added wall time down.
  web-unit-tests-windows:
    name: web-unit-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # Same reasoning as web-tests above: apps/web resolves
      # @picompanion/{protocol,design-tokens,highlight,frontend-core}
      # through their built `dist/`, so the unit suite needs them built
      # here too even though it skips apps/web's own typecheck/build.
      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      # T122: same reasoning as web-tests' matching step above -- this
      # suite imports @picompanion/client as a value (not just types), and
      # this job never built it before, so it ran against whatever `dist/`
      # (stale, or absent) happened to already sit on the runner's checkout
      # rather than the commit under test.
      - name: Build @picompanion/client (protocol -> relay -> client chain)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/client

      - name: Run apps/web unit and component tests
        run: npm run test --workspace=@picompanion/web

  # --- Android typecheck and production prebuild smoke --------------------
  #
  # apps/android is filled by T16 (Expo shell) and later android tasks. The
  # prebuild smoke step runs T16's `build` script, which chains the
  # no-web-artifacts guard and `expo prebuild --platform android --no-install`.

  android-tests:
    name: android-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      # apps/android resolves each of these through built `dist/*.d.ts` /
      # `dist/*.js` (their package.json `exports`), never source, so they must
      # be built before apps/android is typechecked or tested. `highlight` was
      # added by the P5-W10 merge gate: T35A2's
      # `features/files/file-syntax-highlight.ts` is the first Android importer
      # of `@picompanion/highlight`(`/lezer-only`), and without this line both
      # steps below fail on a clean checkout with
      # "TS2307: Cannot find module '@picompanion/highlight'" /
      # "Cannot find package '@picompanion/highlight/lezer-only'". It passed
      # locally only because developer trees already had a stale
      # `packages/highlight/dist`.
      - name: Build frontend-core dependencies (protocol, design-tokens, highlight, frontend-core)
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/frontend-core

      - name: Typecheck apps/android
        run: npm run typecheck --workspace=@picompanion/android

      - name: Run apps/android unit tests
        run: npm run test --workspace=@picompanion/android

      - name: Production prebuild smoke
        if: ${{ hashFiles('apps/android/app.json', 'apps/android/app.config.ts', 'apps/android/app.config.js') != '' }}
        run: npm run build --workspace=@picompanion/android

      # T314: the only step in this repository that resolves a module the way
      # Metro does. Everything above it -- `expo prebuild --no-install`, `tsc`,
      # vitest -- resolves through Node/TypeScript rules instead, and all three
      # rewrite a `./x.js` specifier onto `x.ts`. Metro does not. That gap let
      # 207 Metro-unresolvable imports accumulate across 82 files, and let an
      # over-broad `*.web.*` blocklist in `apps/android/metro.config.js` break
      # a correct `react-native-reanimated` import, with every gate green
      # throughout. Both defects surfaced only when the first real EAS build
      # (run 34369364166) reached `Bundle JavaScript` -- an hour of queue time
      # to learn what this step reports in about three minutes.
      #
      # `expo export` runs Metro over the full router graph and writes a real
      # Hermes bundle, so it fails on exactly what an EAS build would fail on.
      # The output goes to `apps/android/dist`, which `.gitignore` already
      # covers; nothing is uploaded, because the artifact is not the point --
      # the point is that it can be produced at all.
      - name: Android bundle smoke (Metro resolution)
        run: npm run export --workspace=@picompanion/android

  # --- Targeted server tests on Linux and Windows -------------------------
  #
  # T233 investigated wiring `@picompanion/server`'s own `"test"` script
  # (`test:unit && test:integration`) and kept `test:integration` unwired,
  # for a specific, source-confirmed reason, not "it is heavy":
  # `test:integration` runs `src/server/daemon-e2e/{models,live-preferences}
  # .e2e.test.ts` and `src/server/agent/model-catalog.e2e.test.ts`, and its
  # Claude-provider cases run unconditionally (not gated behind a `which
  # claude` check the way the Codex/OpenCode cases are). Every one of them
  # calls `createDaemonTestContext`.
  #
  # CORRECTED at the P9-C merge gate. This said `createDaemonTestContext`
  # "calls `test-utils/claude-auth.ts`'s `seedClaudeAuth`, which throws
  # immediately if neither `CLAUDE_CODE_OAUTH_TOKEN` nor `ANTHROPIC_API_KEY`
  # is set", and that provisioning one of those as a repository secret was
  # the blocker. Both halves were false, and the second would have handed a
  # paid credential to every push and PR run for no benefit.
  # `daemon-test-context.ts` is 55 lines and calls only
  # `createTestPaseoDaemon` and `new DaemonClient`; `seedClaudeAuth`'s sole
  # caller is `useTempClaudeConfigDir`, which itself has zero callers.
  # Executed at the gate with both variables unset,
  #   cd packages/server && npx vitest run \
  #     src/server/agent/model-catalog.e2e.test.ts
  # fails with `AssertionError: expected 'Unknown provider: claude' to be
  # null`, raised by `provider-catalog-session.ts` because the fake-client
  # test daemon carries no provider snapshot entry — not with a credentials
  # error. That daemon is built from `createTestAgentClients()` fakes whose
  # catalog is hard-coded, so a live credential is consulted nowhere on the
  # path. The decision to keep this unwired stands (the suite fails as-is);
  # the diagnosis and the remedy did not, and T250 owns the real one. Ports are
  # not the blocker here — `test-utils/paseo-daemon.ts` binds
  # `127.0.0.1:0` (OS-assigned), never a fixed port. See
  # `docs/ci-matrix.md` §4 for the fuller writeup.
  #
  # T250 measured the real cause, by reading the path from
  # `createTestPaseoDaemon` to the snapshot, not by guessing: this
  # repository's provider registry is Pi-only (plan.md §1.2/§2.3 —
  # `non-Pi agent providers` is a stated non-goal, and
  # `AGENT_PROVIDER_DEFINITIONS` in
  # `packages/protocol/src/provider-manifest.ts` lists exactly one entry,
  # `"pi"`). `ProviderSnapshotManager.buildRegistry()` only lets an
  # `extraClients` fake override a provider's `fetchCatalog` when that
  # provider id is ALREADY a key in the builtin registry
  # (`if (!definition) continue;`); "claude"/"codex"/"opencode" never are,
  # so the three fakes `createTestAgentClients()` builds are silently
  # dropped and no snapshot entry for them can ever exist.
  # `getProviderSnapshotEntryForRead`'s warm-up then filters the requested
  # provider through `resolveRefreshProviders`, which intersects it against
  # `getProviderIds()` (= `["pi"]`) and returns empty, so
  # `warmUpSnapshotForCwd` returns immediately without ever calling
  # `refreshProviders` — the entry stays undefined and the handler emits
  # `Unknown provider: <id>`. Ruled out, not merely disbelieved: the
  # provider list is not "empty by construction" (it has one real entry,
  # `"pi"`) and nothing about this is a catalog-session refactor — the
  # three `test:integration` e2e files
  # (`src/server/daemon-e2e/models.e2e.test.ts`,
  # `src/server/daemon-e2e/live-preferences.e2e.test.ts`,
  # `src/server/agent/model-catalog.e2e.test.ts`) test only
  # "claude"/"codex"/"opencode", never "pi", and predate this repository's
  # provider-scope narrowing to Pi-only — they were carried over from
  # Paseo's multi-provider daemon and never adapted.
  #
  # The suite cannot be made to pass against the fakes as written without
  # either (a) reintroducing non-Pi providers into
  # `AGENT_PROVIDER_DEFINITIONS`, which directly contradicts plan.md §2.3's
  # non-goal, or (b) rewriting all three files to exercise the one real
  # provider ("pi") with a new fake added to
  # `packages/server/src/server/test-utils/fake-agent-client.ts` — a file
  # T250's `Owns:` line does not cover, and a decision about what this
  # suite should even assert that belongs to whoever picks that up next,
  # not to this comment. Confirmed still red against the fakes at T250:
  #   cd packages/server && npx vitest run --maxWorkers=1 \
  #     src/server/agent/model-catalog.e2e.test.ts
  # exits non-zero with the same three `Unknown provider: <id>` failures.
  # `test-utils/claude-auth.ts` (`seedClaudeAuth`) and
  # `test-utils/claude-config.ts` (`useTempClaudeConfigDir`) — named above
  # as dead, zero-call-site helpers kept alive only by the `test-utils/
  # index.ts` barrel re-export — are deleted by T250, not wired: no test
  # anywhere in this repository ever spawns a real "claude"-provider
  # `AgentClient` to seed credentials for, and the one real Claude
  # integration this repository has
  # (`src/terminal/agent-hooks/claude/claude.real.e2e.test.ts`) exercises
  # the ambient, already-configured `claude` CLI directly rather than an
  # isolated temp `CLAUDE_CONFIG_DIR`.
  #
  # T258 made the scope decision this comment's last paragraph left open, and took
  # option (b): all three files now exercise "pi", the one real provider, against a
  # matching fake added to `fake-agent-client.ts`, rather than reintroducing non-Pi
  # providers into `AGENT_PROVIDER_DEFINITIONS`. Run individually and directly (never
  # through this unwired `test:integration` script), all three now pass:
  #   cd packages/server && npx vitest run --maxWorkers=1 \
  #     src/server/daemon-e2e/models.e2e.test.ts \
  #     src/server/daemon-e2e/live-preferences.e2e.test.ts \
  #     src/server/agent/model-catalog.e2e.test.ts
  # (one file per invocation) each exit 0. `test:integration` itself is still not wired
  # into this job — that remains T250's original, still-open subject, not decided here.
  # See T258's entry in `docs/issues-from-plan.md` for the coverage the rescoping to
  # "pi" gives up, file by file.

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps: &server_test_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build server dependency chain
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/client
          npm run build --workspace=@picompanion/server

      - name: Run targeted server tests
        run: npm run test:unit --workspace=@picompanion/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: windows-latest
    steps: *server_test_steps

  # T44A4: `@picompanion/cli` has a real `"test:unit": "vitest run src"`
  # script and 21 test files (173 tests) — see `scripts/ci/guard-workspace-
  # test-coverage.mjs`'s header for how this gap was measured. Deliberately
  # runs `test:unit`, NOT the package's own `"test"` script (`test:unit &&
  # test:local`): `test:local` (`tests/run-all.ts`) spawns real, isolated
  # daemon subprocesses per test file with its own concurrency pool and `zx`
  # dependency. `cli` resolves `@picompanion/{protocol,client,server}`
  # through their built `dist/` (package.json `exports`), so the same
  # dependency chain the `typecheck` job's "Build backend dependency chain"
  # step already builds is built here first.
  #
  # T233 read `test:local` rather than estimating it and kept it unwired.
  # Unlike `test:integration` above, no credential is missing: `grep -rn
  # "ANTHROPIC_API_KEY\|CLAUDE_CODE_OAUTH_TOKEN" packages/cli/tests` finds
  # nothing, and every port in the suite is OS-assigned
  # (`tests/helpers/network.ts`'s `getAvailablePort()`,
  # `tests/setup.ts`/`tests/helpers/test-daemon.ts`'s `getRandomPort()` —
  # ranges 10000-60000 and 20000-30000, 6767/6768 never appear). The actual
  # gap is wall time and shared-runner behavior: `run-all.ts` runs `npm run
  # build:server` first, then 39 numbered test files at concurrency 4 by
  # default, spawning a fresh isolated daemon per file — its own
  # `KNOWN_HEAVY_TESTS` names five files as the long pole (05-agent-run,
  # 06-agent-send, 11-agent-wait, 13-permit-allow-deny, 14-worktree). T233
  # could not produce a trustworthy measured wall-time number for this
  # suite (no access to trigger a real GitHub Actions run, and a full local
  # run was judged unsafe to attempt blind on the machine available to this
  # task — see `docs/ci-matrix.md` §4). Wiring on an estimate is exactly
  # what this repository's CLAUDE.md says not to do; this stays local-only
  # until a real measured run exists.
  cli-tests:
    name: cli-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build cli dependency chain
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/relay
          npm run build --workspace=@picompanion/highlight
          npm run build --workspace=@picompanion/client
          npm run build --workspace=@picompanion/server

      - name: Run cli unit tests
        run: npm run test:unit --workspace=@picompanion/cli

  # --- Daemon package dry-run with bundled new web UI ----------------------
  #
  # Depends on T18's `scripts/build-daemon-web-ui.mjs` and T15's real
  # `apps/web/dist` output. Guarded on the bundling script existing so this
  # job is defined from Phase 1 onward (plan.md §15.4) without hard-failing
  # before those siblings land; once merged, every push exercises it via
  # `full`/`backend`/`web`.

  daemon-package-dry-run:
    name: daemon-package-dry-run
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

      - name: Build web UI bundling prerequisites and dry-run daemon packaging
        if: ${{ hashFiles('scripts/build-daemon-web-ui.mjs') != '' }}
        run: |
          npm run build --workspace=@picompanion/protocol
          npm run build --workspace=@picompanion/design-tokens
          npm run build --workspace=@picompanion/frontend-core
          npm run build --workspace=@picompanion/web
          node scripts/build-daemon-web-ui.mjs
          npm pack --dry-run --ignore-scripts --workspace=@picompanion/server

      # T171: the step above only PRINTS the pack listing — nothing read it,
      # so an `apps/web/dist` that built successfully but produced an empty
      # (or near-empty) `dist/server/web-ui/` bundle was invisible: `npm
      # pack` still exits 0 either way. This asserts the actual tarball
      # contents: a real `index.html` plus enough files and bytes under
      # `dist/server/web-ui/` that the daemon this tarball ships would
      # genuinely serve a web UI. See
      # scripts/ci/guard-daemon-web-ui-bundled.mjs for the thresholds and
      # the calibration they are set against.
      - name: Guard / packed tarball actually carries the built web UI
        if: ${{ hashFiles('scripts/build-daemon-web-ui.mjs') != '' }}
        run: node scripts/ci/run-guard-daemon-web-ui-bundled.mjs

      # T44A1 (plan.md §14.5): "web session route ... under 500 KiB gzip for
      # initial JavaScript and CSS, excluding lazy terminal/editor/diff
      # chunks." This runs its OWN separate `vite build` (with
      # `build.manifest: true`, into a scratch temp directory — it never
      # touches `apps/web/dist` itself, which the steps above and below
      # depend on) to read the real Vite/Rolldown module graph and measure
      # only the session route's static-import closure. See
      # scripts/ci/guard-web-session-bundle-budget.mjs for why a manifest is
      # what makes the "excluding lazy ... chunks" clause a checked fact
      # rather than a hand-applied exemption, and this task's report for the
      # measured number and the real RED/GREEN proof.
      # Deliberately UNCONDITIONAL, unlike the two steps above: this guard
      # runs its own `vite build` from `apps/web/vite.config.ts` and never
      # reads `scripts/build-daemon-web-ui.mjs`, so gating it on that file's
      # existence (as it was written at P9-W1, copied from the packaging
      # steps) would make a budget regression invisible the day that
      # unrelated script moved. `npm ci` above is its only prerequisite.
      - name: Guard / web session route stays under the §14.5 gzip budget
        run: node scripts/ci/run-guard-web-session-bundle-budget.mjs

      - name: Skip (build-daemon-web-ui.mjs not present yet, see T18)
        if: ${{ hashFiles('scripts/build-daemon-web-ui.mjs') == '' }}
        run: echo "scripts/build-daemon-web-ui.mjs not present yet (T18); skipping dry-run."

  # --- Docker and Nix checks when their paths change -----------------------
  #
  # T43A3 added the real packaging inputs, under `packaging/docker/` and
  # `packaging/nix/` rather than the repository-root paths the `docker`/`nix`
  # filters below were written for — so those two filters still match
  # nothing, and `docker-checks`/`nix-checks` below (real `docker build`/`nix
  # build`; neither toolchain runs anywhere else in this workflow) stay
  # dormant. That is a distinct, still-open gap: pointing `docker`/`nix` in
  # .github/ci-paths.yml at `packaging/docker/**`/`packaging/nix/**` so these
  # two jobs actually run. It is not this section's `guard-docker-packaging-
  # paths` job below, which T176 wires against the new `packaging` filter —
  # see packaging/README.md's disclosure for the exact seam.
  #
  # guard-docker-packaging-paths (T176) runs the static packaging guard
  # (scripts/ci/run-guard-docker-packaging-paths.mjs, T43A3/T174) — it reads
  # packaging/docker/Dockerfile and packaging/nix/flake.nix as plain text and
  # checks them without a Docker or Nix toolchain; see that script's own
  # header for exactly what it does and does not prove.

  guard-docker-packaging-paths:
    name: guard-docker-packaging-paths
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.packaging == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run the packaging guard (packaging/docker, packaging/nix)
        run: node scripts/ci/run-guard-docker-packaging-paths.mjs

  # guard-packaging-entrypoints (T175) checks the ONE thing
  # guard-docker-packaging-paths.mjs's header claims but its
  # `extractDockerCopySources` never covers: that the Dockerfile's
  # `ENTRYPOINT`/`CMD` and the Nix flake's `installPhase` launcher path
  # each resolve to something that actually exists — either an
  # already-built `dist/` file, or (meaningful on a clean checkout, where
  # `dist/` is gitignored and absent) the TypeScript source file this
  # repository's own build convention would compile into that path. See
  # scripts/ci/guard-packaging-entrypoints.mjs's header for the exact
  # resolution rule and its disclosed limits. Runs on the same `packaging`
  # filter as guard-docker-packaging-paths above, for the same reason
  # (packaging inputs changing, or the guard's own source changing).
  guard-packaging-entrypoints:
    name: guard-packaging-entrypoints
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.packaging == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run the packaging entrypoint-paths guard (packaging/docker, packaging/nix)
        run: node scripts/ci/run-guard-packaging-entrypoints.mjs

  # guard-dockerignore-depth (T180) checks that every `.dockerignore` bare
  # pattern (`node_modules/`, `dist/`, `*.tsbuildinfo`, ...) that names
  # something this npm-workspaces repo's own tooling produces at MORE THAN
  # ONE depth carries the `**/` prefix Docker's ignore matcher requires to
  # exclude it at every depth, not just the build context root — see
  # scripts/ci/guard-dockerignore-depth.mjs's header for the four
  # tool-convention families it derives this from and the disclosed `*.log`
  # gap. T177 fixed this exact defect for eight patterns; nothing caught a
  # future edit dropping the prefix again until this guard.
  #
  # Wired under the existing `packaging` filter (covers `packaging/**` AND
  # `scripts/ci/**`, T176) rather than a new filter, matching T175's own
  # precedent in the job just above.
  #
  # CORRECTED (T185): this comment used to say the guard's actual input, the
  # repo-root `.dockerignore` file, was "not itself under `packaging/**` or
  # `scripts/ci/**`" so "a pull request that edits ONLY `.dockerignore` will
  # not flip the `packaging` output true and so will not run this job" — and
  # filed that gap for whoever owned `.github/ci-paths.yml` next. That is no
  # longer true: T185 added `.dockerignore` as an exact-file entry under the
  # `packaging` filter in `.github/ci-paths.yml`, so an edit to only that
  # file now flips `packaging` true and runs this job. This still does not
  # route `docker-checks` (that job gates on the separate, deliberately
  # dormant `docker` filter — see that filter's own reserved-for-T43A/
  # phase-8 comment in `.github/ci-paths.yml`), which remains a disclosed,
  # out-of-scope gap, not one this correction closes.
  guard-dockerignore-depth:
    name: guard-dockerignore-depth
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full == 'true' || needs.changes.outputs.packaging == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run the .dockerignore depth-agnostic-pattern guard
        run: node scripts/ci/run-guard-dockerignore-depth.mjs

  docker-checks:
    name: docker-checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build Docker image
        run: docker build -t picompanion-ci-check .

  nix-checks:
    name: nix-checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Evaluate flake
        run: nix flake check

  # T124 (scope corrected T186 — this comment, the job name, and the step
  # name below said "packages/client/src" ships and "apps/web/src or
  # apps/android/src" denies from T147 onward; three widenings since
  # (T147, T156, T179) made that false without anyone updating this file,
  # because `.github/**` is deliberately outside both of the guard's own
  # scans and can never trip on its own stale prose): a capability shipped
  # ANYWHERE this guard treats as shipped source must never coexist with
  # prose denying it, ANYWHERE this guard scans for denials. Seeded with
  # the queue-mode trio; see scripts/ci/guard-capability-prose.mjs's header
  # comment for the full P6-W6-through-T179 history this closes off.
  #
  # Do not restate the scope as a tree list or a count here — both have
  # gone stale before and this comment cannot watch itself. The
  # authoritative scope is `run-guard-capability-prose.mjs`'s own exported
  # `isShippedSourcePath` (what counts as "shipped") and `isAppSourcePath`
  # (where a denial is looked for); read those two functions, or the
  # guard's own summary line printed on every run, rather than trusting
  # this comment to have kept up with the next widening.
  guard-capability-prose:
    name: guard / no prose denies a shipped capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on a shipped capability that this guard's own scope finds denied in prose
        run: node scripts/ci/run-guard-capability-prose.mjs

  # T206: `apps/android/src/platform/offline/versioned-import.test.ts`'s own
  # doc comment (T42B2) states no legacy versioned-JSON schema reader,
  # envelope parser, or `hosts`/`drafts`/`attachments` deserializer keyed to
  # `docs/frontend-data-migration.md` §3's synthetic export envelope exists
  # anywhere under `apps/android/src` or `packages/frontend-core/src`. The
  # P8-W7 merge gate found that repo-wide half enforced by nothing but a
  # grep run once when the test was written — that test's own suite
  # discriminates only within `SqliteStructuredStorage`, and is blind to a
  # working importer added in any other file. This guard is the replacement
  # check: unconditional, alongside guard-legacy-paths et al. above, not
  # gated on any path filter, since the prohibition it enforces is a
  # standing repository invariant, not something scoped to one changed
  # directory. See scripts/ci/guard-no-legacy-schema-reader.mjs for the
  # exact signature (a literal version-1 discriminant plus a real
  # `hosts`/`drafts`/`attachments` read, co-occurring in one file) and its
  # disclosed, deliberate blind spots — do not restate the signature here;
  # that header comment is the authoritative source and this comment cannot
  # watch itself for staleness any better than the ones above it did.
  guard-no-legacy-schema-reader:
    name: guard / no legacy §3 envelope reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on a version===1-keyed hosts/drafts/attachments reader under apps/android/src or packages/frontend-core/src
        run: node scripts/ci/run-guard-no-legacy-schema-reader.mjs

  # P8-W11 gate: T207 shipped `run-guard-app-id-package-pairing.mjs` and no
  # workflow referenced it. Its own module header said "CI runs it via ...",
  # which was false on that commit — the check reached CI only through
  # `guard-app-id-package-pairing.test.mjs`'s real-tree assertion inside the
  # `changes` job's unconditional `node --test scripts/ci/*.test.mjs` step.
  # That is real protection, but not the protection the file claimed, and a
  # test asserting "the real tree is clean" is a different contract from a
  # guard job. This is the third unwired runner in this directory and nothing
  # noticed any of them; T209 adds the check that would have.
  #
  # Unconditional, like the guards above it: the defect it catches is a
  # workflow file disagreeing with a flow file, and either can change without
  # touching a path filter's idea of "android".
  guard-app-id-package-pairing:
    name: guard / every Maestro job installs the package its flows launch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail when a workflow job's EAS profile resolves to a package no flow it runs can launch
        run: node scripts/ci/run-guard-app-id-package-pairing.mjs

  # T44A2 (plan.md §10.5: "Web axe gates pass across every route").
  # Unconditional, alongside guard-legacy-paths et al. above — derives the
  # real route list from apps/web/src/routes/route-tree.ts itself (its own
  # imports, each route file's own path: literal) and fails, in both
  # directions, if apps/web/e2e/fixtures/route-coverage-manifest.ts's
  # ROUTE_COVERAGE ever names a different set of routes: a route added to
  # route-tree.ts with nothing said about it here, or a manifest entry
  # naming a route that no longer exists. Every swept:false entry must also
  # carry a written reason. See scripts/ci/guard-axe-route-coverage.mjs's
  # own header for the full mechanism, and that file's doc comment for the
  # separate, independent TypeScript-level check
  # (apps/web/e2e/accessibility.spec.ts's own `Record<SweptRoutePath, ...>`
  # sweep table) that keeps the manifest and the real axe checks in sync
  # with EACH OTHER -- this guard only ties the manifest to the real route
  # tree.
  guard-axe-route-coverage:
    name: guard / every route is accounted for in the axe sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail when a declared route has no accessibility-sweep manifest entry, or vice versa
        run: node scripts/ci/run-guard-axe-route-coverage.mjs

  # T126: unconditional guard, alongside guard-legacy-paths et al. above —
  # `vite build` reports a `node:` builtin reaching apps/web's bundle graph
  # as a "has been externalized for browser compatibility" **warning** and
  # still exits 0 (P6-W5's `eb9fa55` fixed one by hand), so nothing before
  # this guard stopped a future production import from putting `node:fs`
  # back. Walks the real import graph from apps/web/src/main.tsx; see
  # scripts/ci/guard-no-node-builtin-in-web-bundle.mjs's header comment for
  # the resolution traps handled (ESM .js specifiers resolving to .ts/.tsx
  # source, doc comments that merely quote an import statement, barrel
  # re-exports, test-only files remaining allowed).
  guard-no-node-builtin-in-web-bundle:
    name: "guard / no node: builtin reachable from apps/web's production entry"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Fail on a node: builtin reachable from apps/web/src/main.tsx"
        run: node scripts/ci/run-guard-no-node-builtin-in-web-bundle.mjs

  # T125: unconditional guard, alongside guard-legacy-paths et al. above —
  # enforces a committed ceiling on scripts/ci/orphan-modules.mjs's
  # import-graph orphan count (27 at last measurement, see
  # run-orphan-modules.mjs's own comment for the audited per-file
  # reasoning) so the count can only ever be lowered by a real fix, never
  # silently grow. Deliberately a ceiling, not an exact-equality check —
  # see that script's header comment for why a bare "must equal N" gate is
  # a trap for the next task that legitimately adds a file.
  guard-orphan-modules:
    name: guard / import-graph orphan count ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail if the import-graph orphan count exceeds the committed ceiling
        run: node scripts/ci/run-orphan-modules.mjs

  # T209: T207 shipped `run-guard-app-id-package-pairing.mjs` (the job right
  # above two guards ago) and no workflow referenced it — its own module
  # header falsely claimed "CI runs it via ..." while the only two hits
  # under `.github/` were prose IN COMMENTS, not a `run:` line. The check
  # still reached CI, only through that runner's own test file's real-tree
  # assertion inside the `changes` job's `node --test scripts/ci/*.test.mjs`
  # step above — real protection, but a different, weaker contract than a
  # guard job, and not the one the file claimed. This is the THIRD unwired
  # runner shipped in scripts/ci/ and nothing before this job noticed any of
  # them. This job is the check that would have: it enumerates every
  # scripts/ci/run-guard-*.mjs and fails when one is referenced by no real
  # `run:` step in any .github/workflows/*.yml file (a comment mentioning a
  # runner's filename does not count — see
  # scripts/ci/guard-run-guard-wiring.mjs's own header for why that
  # distinction is the entire point of this guard) and has no reasoned entry
  # in that module's `ALLOWLISTED_UNWIRED_RUN_GUARDS`.
  #
  # T211 widened this guard with two further failure modes, both about the
  # allowlist itself going stale rather than about an unwired runner: an
  # entry naming a runner filename that no longer exists on disk (`kind:
  # "stale-missing-runner"`), and an entry naming a runner some workflow's
  # `run:` content now genuinely invokes (`kind: "stale-wired"`) — see
  # scripts/ci/guard-run-guard-wiring.mjs's own header ("T211") for why
  # these are a separate violation class, not the unwired one under a
  # different name. `run-guard-run-guard-wiring.mjs` reports the first
  # failure mode as `UNWIRED RUNNER` and both stale kinds as `STALE
  # ALLOWLIST ENTRY`.
  #
  # Unconditional, alongside guard-legacy-paths et al. above — this job's
  # own `run:` line, in this exact workflow file, is also the neatest
  # available proof that the guard it runs actually works.
  guard-run-guard-wiring:
    name: guard / every run-guard-*.mjs is wired, allowlisted, and the allowlist is not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on an unwired run-guard runner, or a stale allowlist entry (missing runner or now-wired)
        run: node scripts/ci/run-guard-run-guard-wiring.mjs

  # T44A4 (plan.md §13 phase 9, "Run the complete CI matrix rather than the
  # full suite locally"; docs/issues-from-plan.md T44A4's second acceptance
  # criterion, "the matrix covers protocol, core, web, Android and backend").
  # Unconditional, alongside guard-run-guard-wiring above — the defect this
  # closes (a workspace with real tests and no CI job running them) is a
  # standing repository invariant, not something scoped to one changed
  # directory. Enumerates every workspace from the root package.json's
  # `workspaces` field and fails when one is tested by no `run:` step in any
  # workflow and has no reasoned ALLOWLISTED_UNTESTED_WORKSPACES entry, or
  # when that allowlist itself has gone stale (T211/T213 shape — see
  # scripts/ci/guard-workspace-test-coverage.mjs for both violation classes).
  # This guard's own first run found, and this same commit closed, the exact
  # gap it exists to prevent from recurring: `@picompanion/relay` (7 test
  # files) and `@picompanion/cli` (21 test files) were both listed under the
  # `backend` path filter with no job running either's tests — see the
  # `relay-tests`/`cli-tests` jobs above.
  guard-workspace-test-coverage:
    name: guard / every workspace has a real CI test job or a reasoned allowlist entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on an untested workspace, or a stale allowlist entry (missing workspace or now-tested)
        run: node scripts/ci/run-guard-workspace-test-coverage.mjs

  # T44A3 (plan.md §13 phase 9, "Complete ... version-drift checks";
  # docs/security-and-version-drift.md is the findings register this job's
  # own passing/failing result feeds). Unconditional, alongside
  # guard-legacy-paths et al. above: a stale `@picompanion/*` version pin or
  # a diverging wire-protocol literal is a standing repository invariant,
  # not something scoped to one changed directory. See
  # scripts/ci/guard-version-drift.mjs for the three checked axes (workspace
  # dependency pins vs. their targets' own versions; the daemon/client
  # WS-hello protocol version literal; protocol/relay's own duplicated
  # relay-wire-version literal) and the axes it deliberately does not check.
  guard-version-drift:
    name: guard / no version drift between workspace pins, protocol, client and daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on a stale @picompanion/* version pin or a diverging protocol/client/daemon wire-version literal
        run: node scripts/ci/run-guard-version-drift.mjs

  # T44A3. Unconditional — a committed credential is a standing risk
  # regardless of which directory changed. See scripts/ci/guard-secret-scan.mjs
  # for the curated pattern list and its disclosed scope (no generic entropy
  # scanning, no history scan — tracked-tree-only, by design).
  guard-secret-scan:
    name: guard / no committed file matches a curated secret pattern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail when a tracked file matches a curated, high-signal secret pattern
        run: node scripts/ci/run-guard-secret-scan.mjs

  # T227: `scripts/ci` runs from the repository root with no workspace
  # manifest of its own, so a third-party import there has no manifest to
  # satisfy it except the root `package.json`. An import that resolves only
  # because npm hoisted some OTHER workspace's copy into the root
  # `node_modules` (the T194 shape) works silently until a nested or
  # conflicting install anywhere in the tree stops the hoist from resolving
  # it — exactly what this guard found: `run-guard-web-session-bundle-
  # budget.mjs` imported `vite`, declared only in `apps/web/package.json`.
  # Unconditional and needs no `npm ci`: it reads only the committed
  # `scripts/ci/*.mjs` source text and the committed root `package.json`,
  # never the installed `node_modules` tree — see
  # scripts/ci/guard-declared-root-dependencies.mjs for the checked rule,
  # its production-files-only scope, and its comment-stripping design.
  guard-declared-root-dependencies:
    name: guard / every scripts/ci third-party import is declared in the root package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail on a scripts/ci third-party import the root package.json does not declare
        run: node scripts/ci/run-guard-declared-root-dependencies.mjs

  # T44B1: `guard-secret-scan.mjs` above does not cover this. It asks a
  # content-shaped question — "does this file's TEXT look like a live
  # credential" — which a binary keystore, whose secret is a key entry in a
  # container format rather than a PEM block sitting in text, does not
  # answer. That left the "signing material is not present in the
  # repository" criterion with zero enforcement. See
  # scripts/ci/guard-signing-material.mjs for the full reasoning.
  # (CORRECTED at the P9-F merge gate. This said that guard's
  # `BINARY_EXTENSIONS` skip list "explicitly excludes `.keystore`, `.jks`,
  # `.apk` and `.aab` from ever being scanned". T248 deleted that set
  # earlier in the same wave; every tracked file's content is now read
  # through `readContentForScan`, subject only to `MAX_SCANNED_BYTES`. The
  # reason this separate job exists is unchanged — an extension/filename-
  # first check catches a keystore whatever its bytes decode to — but the
  # mechanism named here no longer exists.) Unconditional,
  # same as guard-secret-scan above — a committed keystore is a standing risk
  # regardless of which directory changed.
  guard-signing-material:
    name: guard / no committed file looks like Android/EAS signing material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fail when a tracked file looks like a keystore, credentials export, or PEM private key
        run: node scripts/ci/run-guard-signing-material.mjs

  # T44A3. Needs `npm ci` first (npm audit reads the real, installed
  # dependency tree) and network access to npm's advisory registry, so this
  # is not folded into the unconditional guards above. See
  # scripts/ci/guard-audit-baseline.mjs for why this is a documented
  # baseline diff rather than a bare `npm audit --audit-level=...` gate, and
  # docs/security-and-version-drift.md for the full, reasoned findings
  # register every baseline entry traces back to.
  guard-audit-baseline:
    name: guard / npm audit findings stay inside the documented baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - name: Fail when npm audit reports an advisory outside the documented baseline
        run: node scripts/ci/run-guard-audit-baseline.mjs
